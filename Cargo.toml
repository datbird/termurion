[package]
name = "tandem"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
alacritty_terminal = "=0.26.0"
arboard = "3"
base64 = "0.22"
regex = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
unicode-width = "0.2"
fancy-regex = "0.14"
bytemuck = "1"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
glyphon = "0.12"
muda = "0.20"
plist = "1"
pollster = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tar = "0.4"
toml = "1"
uuid = { version = "1", features = ["v4"] }
wgpu = "30"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
# Windows Hello for the password manager's gate (UserConsentVerifier); both are already in the
# tree (through wgpu), only these features are new.
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# alacritty_terminal with row marks (crates/alacritty_terminal/TANDEM-PATCHES.md).
[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty_terminal" }
