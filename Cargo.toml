[package]
name = "tandem"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
alacritty_terminal = "=0.26.0"
arboard = "3"
base64 = "0.22"
regex = "1"
# AI chat history in iTerm2's chatdb.sqlite schema (m12 ruling 5).
rusqlite = { version = "0.40.2", features = ["bundled"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
unicode-bidi = "0.3"
unicode-general-category = "1.1"
unicode-width = "0.2"
fancy-regex = "0.14"
bytemuck = "1"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
glyphon = "0.12"
muda = "0.20"
plist = "1"
pollster = "0.4"
prost = "0.14"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tar = "0.4"
toml = "1"
# The Python API's cookies (16 random bytes each); already in the tree through uuid.
getrandom = "0.4"
# The Python API's WebSocket framing only; Tandem does its own HTTP (src/api_http.rs).
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
wgpu = "30"
winit = "0.30"
# Box and block drawing rasterizes its paths with zeno (already in the tree through swash).
zeno = "0.3"

[target.'cfg(windows)'.dependencies]
# Windows Hello for the password manager's gate (UserConsentVerifier); both are already in the
# tree (through wgpu), only these features are new. Win32_System_Variant and Win32_UI_Accessibility are the UI Automation provider (uia_win), each named here on purpose.
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
# The WebView2 host (src/webhost_win.rs). On MSVC the crate links WebView2LoaderStatic.lib into the exe: no WebView2Loader.dll ships.
webview2-com = "0.39.1"
windows-future = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# alacritty_terminal with row marks (crates/alacritty_terminal/TANDEM-PATCHES.md).
[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty_terminal" }
# vte with a readable parser state (crates/vte/TANDEM-PATCHES.md).
vte = { path = "crates/vte" }
# glyphon with a mask filter for aliased and thin text (crates/glyphon/TANDEM-PATCHES.md).
glyphon = { path = "crates/glyphon" }
