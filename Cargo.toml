[package]
name = "termurion"
version = "1.0.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
alacritty_terminal = "=0.26.0"
arboard = "3"
base64 = "0.22"
regex = "1"
# AI chat history in iTerm2's chatdb.sqlite schema (m12 ruling 5).
rusqlite = { version = "0.40.2", features = ["bundled"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
unicode-bidi = "0.3"
unicode-general-category = "1.1"
unicode-width = "0.2"
fancy-regex = "0.14"
railroad = { version = "0.3", default-features = false }
bytemuck = "1"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
glyphon = "0.12"
plist = "1"
pollster = "0.4"
prost = "0.14"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tar = "0.4"
toml = "1"
# The Python API's cookies (16 random bytes each); already in the tree through uuid.
getrandom = "0.4"
# The Python API's WebSocket framing only; Termurion does its own HTTP (src/api_http.rs).
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
wgpu = { version = "30", features = ["glsl", "naga-ir"] }
winit = "0.30"
# Box and block drawing rasterizes its paths with zeno (already in the tree through swash).
zeno = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# System-wide hotkeys: Carbon hot keys on macOS, an X11 key grab on Linux (src/platform/unix/global_keys.rs).
global-hotkey = "0.9.0"

# Wayland sessions get the clipboard and the primary selection through the data-control protocol.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
# Without data-control (GNOME, weston) the clipboard goes through the window's own Wayland
# connection (src/platform/unix/clipboard.rs); wl-clipboard-rs only tells which. Both already in the tree.
smithay-clipboard = "0.7"
wl-clipboard-rs = "0.9"
# The menu model only: the bar is drawn in the window (src/menu_overlay.rs), so no GTK and no libxdo.
muda = { version = "0.20", default-features = false }
# Desktop notifications over the session bus (src/platform/linux/notify.rs): one shared connection.
zbus = "5"
# The hotkey window's X11 calls (src/platform/linux/hotkey.rs); already in the tree through arboard.
x11rb = "0.13"
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
# A notification click's window activation on Wayland (src/platform/linux/activation.rs); all three
# are already in the tree through winit.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# The user's locale on macOS (CFLocaleCopyCurrent); already in the tree through winit.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
# The menu bar, pop-ups and the view's key path (src/platform/macos). objc2 0.6 is muda's; winit's own
# 0.5 stays inside winit, and nothing here may add a third.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSBundle", "NSURL", "NSDictionary", "NSDate", "NSError", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSData", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSResponder", "NSView", "NSWindow", "NSRunningApplication", "NSWorkspace", "NSScreen", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "objc2-core-foundation", "libc"] }
# Notifications (src/platform/macos/notify.rs).
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSound", "UNNotificationResponse", "UNNotificationSettings", "UNNotification", "UNNotificationTrigger", "UNError"] }
# The Keychain (src/platform/macos/keychain.rs) and the Touch ID gate (user_auth.rs).
security-framework = "3"
# The CFData an item update takes (the same 0.10 security-framework uses).
core-foundation = "0.10"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
muda = "0.20"

[target.'cfg(windows)'.dependencies]
# Windows Hello for the password manager's gate (UserConsentVerifier); both are already in the
# tree (through wgpu), only these features are new. Win32_System_Variant and Win32_UI_Accessibility are the UI Automation provider (uia_win), each named here on purpose.
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
# The WebView2 host (src/webhost_win.rs). On MSVC the crate links WebView2LoaderStatic.lib into the exe: no WebView2Loader.dll ships.
webview2-com = "0.39.1"
windows-future = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# alacritty_terminal with row marks (crates/alacritty_terminal/TERMURION-PATCHES.md).
[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty_terminal" }
# vte with a readable parser state (crates/vte/TERMURION-PATCHES.md).
vte = { path = "crates/vte" }
# glyphon with a mask filter for aliased and thin text (crates/glyphon/TERMURION-PATCHES.md).
glyphon = { path = "crates/glyphon" }
