# m14r rename table (Task 1). Exact literals only, no regex.
#
# [[row]] fields: group (A user strings, B identifiers, C data paths, D code identifiers,
#   E docs and scripts, F assets, K keep), old, new, mode (exact | word | keep), scope (globs), reason.
# Resolution per line: the longest occurrence wins, a keep row wins ties, then the row listed first.
# A hit (case-insensitive 'tandem') is MAPPED only when a winning row covers it.
# Case variants are separate rows on purpose: a hit like 'TanDem' stays UNMAPPED.
# [[path]] marks whole files: keep (never touched) or keep-history (historical record, not edited).
# [[asset]] records the new art locations for later tasks (8: exe/window/tray icons, 10: docs).

# ---- whole-file rules ----
[[path]]
glob = 'docs/superpowers/plans/**'
mode = 'keep-history'
reason = 'historical plans stay as written; README note added in Task 10'

[[path]]
glob = 'docs/superpowers/rulings/**'
mode = 'keep-history'
reason = 'historical rulings stay as written'

[[path]]
glob = 'tests/fixtures/tmux/*.bin'
mode = 'keep'
reason = 'recorded tmux bytes contain the old path'

[[path]]
glob = '**/LICENSE*'
mode = 'keep'
reason = 'license and third-party attribution text'

[[path]]
glob = '**/COPYING*'
mode = 'keep'
reason = 'third-party notices'

[[path]]
