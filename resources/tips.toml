# Generated by scripts/gen-tips.py from iTerm2's iTermTipData.m. Do not edit.

[[tip]]
key = "000"
title = "Tip of the Day"
body = "This window shows the Tandem tip of the day. It\u2019ll appear every 24 hours to let you know about new features and hidden secrets. Hit \u201CMore Options\u201D to view more tips or to stop getting them altogether."

[[tip]]
key = "0000"
title = "Shell Integration"
body = "The big new feature of Tandem version 3 is Shell Integration. Click \u201CLearn More\u201D for all the details."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0001"
title = "Timestamps"
body = "\u201CView > Show Timestamps\u201D shows the time (and date, if appropriate) when each line was last modified."

[[tip]]
key = "0002"
title = "Password Manager"
body = "Did you know Tandem has a password manager? Open it with \u201CWindow > Password Manager.\u201D You can define a Trigger to open it for you at a password prompt in \u201CSettings > Profiles > Advanced > Triggers.\u201D"

[[tip]]
key = "0003"
title = "Open Quickly"
body = "You can quickly search through your sessions with \u201CView > Open Quickly\u201D (Shift+Win+O). You can type a query and sessions whose name, badge, current hostname, current user name, recent commands, and recent working directories match will be surfaced. It works best with Shell Integration so the user name, hostname, command, and directories can be known even while sshed."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0004"
title = "Undo Close"
body = "If you close a session, tab, or window by accident you can undo it with \u201CEdit > Undo\u201D (Win+Z). By default you have five seconds to undo, but you can adjust that timeout in \u201CSettings > Profiles > Session.\u201D"

[[tip]]
key = "0005"
title = "Annotations"
body = "Want to mark up your scrollback history? Right click on a selection and choose \u201CAnnotate Selection\u201D to add a personal note to it. Use \u201CView > Show Annotations\u201D to show or hide them, and look in \u201CEdit > Marks and Annotations\u201D for more things you can do."

[[tip]]
key = "0006"
title = "Copy with Styles"
body = "Copy a selection with Alt+Win+C to include styles such as colors and fonts. You can make this the default action for Copy in \u201CSettings > Advanced.\u201D"

[[tip]]
key = "0007"
title = "Inline Images"
body = "Tandem can display images (even animated GIFs) inline."
url = "https://iterm2.com/images.html"

[[tip]]
key = "0008"
title = "Automatic Profile Switching"
body = "Automatic Profile Switching changes the current profile when the username, hostname, or directory changes. Set it up in \u201CSettings > Profiles > Advanced.\u201D It requires Shell Integration to be installed."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0009"
title = "Captured Output"
body = "Tandem can act like an IDE using the Captured Output feature. When it sees text matching a regular expression you define, like compiler errors, it shows the matching lines in the Toolbelt. You can click to jump to the line in your terminal and double-click to perform an action like opening an editor to the line with the error."
url = "https://iterm2.com/captured_output.html"

[[tip]]
key = "0010"
title = "Badges"
body = "You can display a status message in the top right of your session in the background. It\u2019s called a \u201CBadge.\u201D If you install Shell Integration you can include info like user name, hostname, current directory, and more."
url = "https://iterm2.com/badges.html"

[[tip]]
key = "0011"
title = "Dynamic Profiles"
body = "Dynamic Profiles let you store your profiles as one or more JSON files. It\u2019s great for batch creating and editing profiles."
url = "https://iterm2.com/dynamic-profiles.html"

[[tip]]
key = "0012"
title = "Advanced Paste"
body = "\u201CEdit > Paste Special > Advanced Paste\u201D lets you preview and edit text before you paste. You get to tweak options, like how to handle control codes, or even to base-64 encode before pasting."

[[tip]]
key = "0013"
title = "Zoom"
body = "Ever wanted to focus on a block of lines without distraction, or limit Find to a single command\u2019s output? Select the lines and choose \u201CView > Zoom In on Selection.\u201D The session\u2019s contents will be temporarily replaced with the selection. Press \u201Cesc\u201D to unzoom."

[[tip]]
key = "0014"
title = "Semantic History"
body = "The \u201CSemantic History\u201D feature allows you to Win+click on a file or URL to open it."

[[tip]]
key = "0015"
title = "Tmux Integration"
body = "If you use tmux, try running \u201Ctmux -CC\u201D to get Tandem\u2019s tmux integration mode. The tmux windows show up as native Tandem windows, and you can use Tandem\u2019s keyboard shortcuts. It even works over ssh!"
url = "https://gitlab.com/gnachman/iterm2/wikis/TmuxIntegration"

[[tip]]
key = "0016"
title = "Triggers"
body = "Tandem can automatically perform actions you define when text matching a regular expression is received. For example, you can highlight text or show an alert box. Set it up in \u201CSettings > Profiles > Advanced > Triggers.\u201D"
url = "https://www.iterm2.com/documentation-triggers.html"

[[tip]]
key = "0017"
title = "Smart Selection"
body = "Quadruple click to perform Smart Selection. It figures out if you\u2019re selecting a URL, filename, email address, etc. based on prioritized regular expressions."
url = "https://www.iterm2.com/smartselection.html"

[[tip]]
key = "0018"
title = "Instant Replay"
body = "Press Alt+Win+B to step back in time in a terminal window. Use arrow keys to go frame by frame. Hold Shift and press arrow keys to go faster."

[[tip]]
key = "0019"
title = "Hotkey Window"
body = "You can have a terminal window open with a keystroke, even while in other apps. Click \u201CCreate a Dedicated Hotkey Window\u201D in \u201CSettings > Keys.\u201D"

[[tip]]
key = "0020"
title = "Hotkey Window"
body = "Hotkey windows can stay open after losing focus. Turn it on in \u201CWindow > Pin Hotkey Window.\u201D"

[[tip]]
key = "0021"
title = "Cursor Guide"
body = "The cursor guide is a horizontal line that follows your cursor. You can turn it on in \u201CSettings > Profiles > Colors\u201D or toggle it with the Alt+Win+; shortcut."

[[tip]]
key = "0022"
title = "Shell Integration: Alerts"
body = "The Shell Integration feature lets you ask to be alerted (Alt+Win+A) when a long-running command completes."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0023"
title = "Cursor Blink Rate"
body = "You can configure how quickly the cursor blinks in \u201CSettings > Advanced.\u201D"

[[tip]]
key = "0024"
title = "Shell Integration: Navigation"
body = "The Shell Integration feature lets you navigate among shell prompts with Shift+Win+Up and Shift+Win+Down."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0025"
title = "Shell Integration: Status"
body = "The Shell Integration feature puts a blue arrow next to your shell prompt. If you run a command that fails, it turns red. Right click on it to get the running time and status."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0026"
title = "Shell Integration: Selection"
body = "With Shell Integration installed, you can select the output of the last command with Shift+Win+A."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0027"
title = "Bells"
body = "The taskbar button shows a count of the number of bells rung and notifications posted since the app was last active."

[[tip]]
key = "0028"
title = "Shell Integration: Downloads"
body = "If you install Shell Integration on a machine you ssh to, you can right click on a filename (for example, in the output of \u201Cls\u201D) and choose \u201CDownload with scp\u201D to download the file."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0029"
title = "Find Your Cursor"
body = "Press Win+/ to locate your cursor. It\u2019s fun!"

[[tip]]
key = "0030"
title = "Customize Smart Selection"
body = "You can edit Smart Selection regular expressions in \u201CSettings > Profiles > Advanced > Smart Selection.\u201D"
url = "https://www.iterm2.com/smartselection.html"

[[tip]]
key = "0031"
title = "Smart Selection Actions"
body = "Assign an action to a Smart Selection rule in \u201CSettings > Profiles > Advanced > Smart Selection > Edit Actions.\u201D They go in the context menu and override semantic history on Win+click."
url = "https://www.iterm2.com/smartselection.html"

[[tip]]
key = "0032"
title = "Visual Bell"
body = "If you want the visual bell to flash the whole screen instead of show a bell icon, you can turn that on in \u201CSettings > Advanced.\u201D"

[[tip]]
key = "0033"
title = "Tab Menu"
body = "Right click on a tab to change its color, close tabs after it, or to close all other tabs."

[[tip]]
key = "0034"
title = "Tags"
body = "You can assign tags to your profiles, and by clicking \u201CTags>\u201D anywhere you see a list of profiles you can browse those tags."

[[tip]]
key = "0035"
title = "Tag Hierarchy"
body = "If you put a slash in a profile\u2019s tag, that implicitly defines a hierarchy. You can see it in the Profiles menu as nested submenus."

[[tip]]
key = "0036"
title = "Downloads"
body = "Tandem can download files by base-64 encoding them. Click \u201CLearn More\u201D to download a shell script that makes it easy."
url = "https://iterm2.com/download.sh"

[[tip]]
key = "0037"
title = "Command Completion"
body = "If you install Shell Integration, Shift+Win+; helps you complete commands. It remembers the commands you\u2019ve run on each host that has Shell Integration installed. It knows how often that command was run and how recently to help make the best suggestions."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0038"
title = "Recent Directories"
body = "Tandem remembers which directories you use the most on each host that has Shell Integration installed. There\u2019s a Toolbelt tool to browse them, and Alt+Win+/ gives you a popup sorted by frequency and recency of use."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0039"
title = "Favorite Directories"
body = "If you have Shell Integration installed, you can \u201Cstar\u201D a directory to keep it always at the bottom of the Recent Directories tool in the Toolbelt. Right click and choose \u201CToggle Star.\u201D"
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0040"
title = "Shell Integration History"
body = "Install Shell Integration and turn on \u201CSettings > General > Save copy/paste and command history to disk\u201D to remember command history per host across restarts of Tandem."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0041"
title = "Paste File as Base64"
body = "Copy a file to the pasteboard in Explorer and then use \u201CEdit > Paste Special > Paste File Base64-Encoded\u201D for easy uploads of binary files. Use \u201Dbase64 -D\u201D (or -d on Linux) on the remote host to decode it."

[[tip]]
key = "0042"
title = "Split Panes"
body = "You can split a tab into multiple panes with Win+D and Shift+Win+D."

[[tip]]
key = "0043"
title = "Adjust Split Panes"
body = "Resize split panes with the keyboard using Ctrl+Win+-Arrow Key."

[[tip]]
key = "0044"
title = "Move Cursor"
body = "Hold Alt and click to move your cursor. It works best with Shell Integration installed (to avoid sending up/down arrow keys to your shell)."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0045"
title = "Edge Windows"
body = "You can tell your profile to create windows that are attached to one edge of the screen in \u201CSettings > Profiles > Window.\u201D You can resize them by dragging the edges."

[[tip]]
key = "0046"
title = "Tab Color"
body = "You can assign colors to tabs in \u201CSettings > Profiles > Colors,\u201D or in the View menu."

[[tip]]
key = "0047"
title = "Rectangular Selection"
body = "Hold Alt+Win while dragging to make a rectangular selection."

[[tip]]
key = "0048"
title = "Multiple Selection"
body = "Hold Win while dragging to make multiple discontinuous selections."

[[tip]]
key = "0049"
title = "Dragging Panes"
body = "Hold Shift+Alt+Win and drag a session into another session to create or change split panes."

[[tip]]
key = "0050"
title = "Cursor Boost"
body = "Adjust Cursor Boost in \u201CSettings > Profiles > Colors\u201D to make all colors more muted, except the cursor. Use a bright white cursor and it pops!"

[[tip]]
key = "0051"
title = "Minimum Contrast"
body = "Adjust \u201CMinimum Contrast\u201D in \u201CSettings > Profiles > Colors\u201D to ensure text is always legible regardless of text/background color combination."

[[tip]]
key = "0052"
title = "Tabs"
body = "Normally, new tabs appear at the end of the tab bar. There\u2019s a setting in \u201CSettings > Advanced\u201D to place them next to your current tab."

[[tip]]
key = "0053"
title = "Base Conversion"
body = "Right-click on a number and the context menu shows it converted to hex or decimal as appropriate."

[[tip]]
key = "0054"
title = "Saved Searches"
body = "In \u201CSettings > Keys\u201D you can assign a keystroke to a search for a regular expression with the \u201CFind Regular Expression\u2026\u201D action."

[[tip]]
key = "0055"
title = "Find URLs"
body = "Search for URLs using \u201CEdit > Find > Find URLs.\u201D Navigate search results with Win+G and Shift+Win+G. Open the current selection with Alt+Win+O."

[[tip]]
key = "0056"
title = "Triggers"
body = "The \u201Cinstant\u201D checkbox in a Trigger allows it to fire while the cursor is on the same line as the text that matches your regular expression."

[[tip]]
key = "0057"
title = "Soft Boundaries"
body = "Turn on \u201CEdit > Selection Respects Soft Boundaries\u201D to recognize split pane dividers in programs like vi, emacs, and tmux so you can select multiple lines of text."

[[tip]]
key = "0058"
title = "Select Without Dragging"
body = "Single click where you want to start a selection and Shift+-click where you want it to end to select text without dragging."

[[tip]]
key = "0059"
title = "Smooth Window Resizing"
body = "Hold Ctrl while resizing a window and it won\u2019t snap to the character grid: you can make it any size you want."

[[tip]]
key = "0060"
title = "Pasting Tabs"
body = "If you paste text containing tabs, you\u2019ll be asked if you want to convert them to spaces. It\u2019s handy at the shell prompt to avoid triggering filename completion."

[[tip]]
key = "0061"
title = "Bell Silencing"
body = "Did you know? If the bell rings too often, you\u2019ll be asked if you\u2019d like to silence it temporarily. Tandem cares about your comfort."

[[tip]]
key = "0062"
title = "Profile Search"
body = "Every list of profiles has a search field (e.g., in \u201DSettings > Profiles.\u201D) You can use various operators to restrict your search query. Click \u201CLearn More\u201D for all the details."
url = "https://iterm2.com/search_syntax.html"

[[tip]]
key = "0063"
title = "Color Schemes"
body = "The online color gallery features over one hundred beautiful color schemes you can download."
url = "https://www.iterm2.com/colorgallery"

[[tip]]
key = "0064"
title = "ASCII/Non-Ascii Fonts"
body = "You can have a separate font for ASCII versus non-ASCII text. Enable it in \u201CSettings > Profiles > Text.\u201D"

[[tip]]
key = "0065"
title = "Coprocesses"
body = "A coprocess is a job, such as a shell script, that has a special relationship with a particular Tandem session. All output in a terminal window (that is, what you see on the screen) is also input to the coprocess. All output from the coprocess acts like text that the user is typing at the keyboard."
url = "https://iterm2.com/coprocesses.html"

[[tip]]
key = "0067"
title = "Ligatures"
body = "If you use a font that supports ligatures, you can enable ligature support in Settings > Profiles > Text."

[[tip]]
key = "0068"
title = "Floating Hotkey Window"
body = "New in 3.1: You can configure your hotkey window to appear over other apps\u2019 full screen windows. Turn on \u201CFloating Window\u201D in \u201CSettings > Profiles > Keys > Customize Hotkey Window.\u201D"

[[tip]]
key = "0069"
title = "Multiple Hotkey Windows"
body = "New in 3.1: You can have multiple hotkey windows. Each profile can have one or more hotkeys."

[[tip]]
key = "0070"
title = "Double-Tap Hotkey"
body = "New in 3.1: You can configure a hotkey window to open on double-tap of a modifier in \u201CSettings > Profiles > Keys > Customize Hotkey Window.\u201D"

[[tip]]
key = "0071"
title = "Buried Sessions"
body = "You can \u201Cbury\u201D a session with \u201CSession > Bury Session.\u201D It remains hidden until you restore it by selecting it from \u201CSession > Buried Sessions > Your session.\u201D"

[[tip]]
key = "0072"
title = "Python API"
body = "You can add custom behavior to Tandem using the Python API."
url = "https://iterm2.com/python-api"

[[tip]]
key = "0073"
title = "Status Bar"
body = "You can add a configurable status bar to your terminal windows."
url = "https://iterm2.com/3.3/documentation-status-bar.html"

[[tip]]
key = "0074"
title = "Minimal Theme"
body = "Try the \u201CMinimal\u201D and \u201CCompact\u201D themes to reduce visual clutter. You can set it in \u201CSettings > Appearance > General.\u201D"

[[tip]]
key = "0076"
title = "Session Titles"
body = "You can configure which elements are present in session titles in \u201CSettings > Profiles > General > Title.\u201D"

[[tip]]
key = "0077"
title = "Tab Icons"
body = "Tabs can show an icon indicating the current application. Configure it in \u201CSettings > Profiles > General > Icon.\u201D"

[[tip]]
key = "0078"
title = "Drag Window by Tab"
body = "Hold Alt while dragging a tab to move the window. This is useful in the Compact and Minimal themes, which have a very small area for dragging the window."

[[tip]]
key = "0079"
title = "Composer"
body = "Press Shift+Win. to open the Composer. It gives you a scratchpad to edit a command before sending it to the shell."

[[tip]]
key = "0080"
title = "Shell Integration: Uploads"
body = "If you install Shell Integration on a machine you ssh to, you can drag-drop from Explorer into the remote host by holding Alt while dragging. The destination directory is determined by where you drop the file in the terminal window: run cd foo, then drop the file below the cd command, and the file will go into the foo directory."
url = "https://iterm2.com/shell_integration.html"

[[tip]]
key = "0081"
title = "Composer Power Features"
body = "The composer supports multiple cursors. It also has the ability to send just one command out of a list, making it easy to walk through a list of commands one-by-one. Click the help button in the composer for details."

[[tip]]
key = "0082"
title = "Render Selection"
body = "Transform selected text into a prettified, syntax-highlighted view with the \u201CRender Selection\u201D command, ideal for JSON, Markdown, or source code. This feature includes horizontal scrolling for easy log navigation."

[[tip]]
key = "0083"
title = "SSH Integration"
body = "Export environment variables and copy files to remote hosts seamlessly with SSH integration. Either configure a profile to use ssh or use it2ssh in place of ssh."

[[tip]]
key = "0084"
title = "Auto Composer"
body = "Improve your command line with the \u201Cauto composer\u201D, which replaces the command line with a native control for ease of use. Requires shell integration."

[[tip]]
key = "0085"
title = "AI Command Writing"
body = "Generate commands using AI by entering a prompt in the composer and selecting \u201CEdit > Engage Artificial Intelligence\u201D. An OpenAI API key is required for this functionality."

[[tip]]
key = "0086"
title = "Codecierge Tool"
body = "Set and achieve terminal goals with \u201CCodecierge\u201D, a Toolbelt feature that guides you step-by-step based on your terminal activity. An OpenAI API key is necessary for this feature."

[[tip]]
key = "0087"
title = "Named Marks"
body = "Navigate your command history effortlessly with \u201Cnamed marks\u201D by assigning names to lines in the terminal."

[[tip]]
key = "0088"
title = "Font Assignments"
body = "You can assign specific fonts to Unicode ranges. Use 'Settings > Profiles > Text > Manage Special Exceptions' to manage it and to install a huge set of Powerline symbols."

[[tip]]
key = "0089"
title = "Disable Transparency"
body = "Maintain clarity in your active window while enjoying transparency in background windows by using 'View > Disable transparency in key window'."

[[tip]]
key = "0090"
title = "Leader Shortcut"
body = "Create two-keystroke shortcuts with a \u201Cleader\u201D: a special keystroke that precedes a custom key binding."

[[tip]]
key = "0091"
title = "Sequence Binding"
body = "Execute a series of actions in order with a single shortcut using \u201Csequence\u201D key bindings."

[[tip]]
key = "0092"
title = "Export/Import Settings"
body = "Easily backup or transfer your Tandem settings using the Export/Import feature in \u201CSettings > General > Settings\u201D."

[[tip]]
key = "0093"
title = "Multi-Session Bindings"
body = "Apply key bindings uniformly across multiple sessions for consistent control in different tabs or windows."

[[tip]]
key = "0094"
title = "Inject Trigger"
body = "Simulate terminal input as if it were output from a running app with the \u201CInject\u201D trigger."

[[tip]]
key = "0095"
title = "Trigger Status Bar"
body = "Easily manage your triggers using the new Triggers status bar component."

[[tip]]
key = "0096"
title = "Session Size in Tab"
body = "Display session size directly in tab titles for convenient at-a-glance information."

[[tip]]
key = "0097"
title = "Advanced Snippet Editing"
body = "Edit snippets in Advanced Paste by holding the Alt key, or open them in the composer with Shift."

[[tip]]
key = "0098"
title = "HTML Logs"
body = "Save your terminal logs in HTML format for enhanced readability and sharing capabilities."

[[tip]]
key = "0099"
title = "ASCIICast Logs"
body = "Create and play back terminal recordings with ASCIICast logs, compatible with asciinema."

[[tip]]
key = "0100"
title = "Timestamped Logs"
body = "Include timestamps in your logs for better tracking and event correlation."

[[tip]]
key = "0101"
title = "LastPass & 1Password"
body = "Utilize LastPass or 1Password with the password manager by configuring it in the menu next to the search field."

[[tip]]
key = "0102"
title = "Password Manager Access"
body = "Access your password manager without authentication by adjusting the settings via the menu next to its search field."

[[tip]]
key = "0103"
title = "Password Generation"
body = "Generate strong, secure passwords using the password manager\u2019s new password generation feature."

[[tip]]
key = "0104"
title = "it2tip Utility"
body = "Access tips of the day with the it2tip utility, a command line app. Enable it by installing shell integration and utilities."

[[tip]]
key = "0106"
title = "Command Prompt Info"
body = "Get detailed information about commands by Win+clicking on the command prompt."

[[tip]]
key = "0107"
title = "tmux Integration"
body = "Use tmux integration for automatic key bindings that emulate tmux\u2019s shortcuts, configurable via the Leader settings."

[[tip]]
key = "0108"
title = "tmux Clipboard Mirroring"
body = "Sync your tmux paste buffer with the local clipboard for seamless integration (requires tmux 3.4)."

[[tip]]
key = "0109"
title = "Multi-Cursor in Composer"
body = "Enhance your editing in the Composer with multiple cursors, created using Ctrl+Shift+-up/down or Alt+-drag."

[[tip]]
key = "0110"
title = "Advanced Paste from Composer"
body = "Move content from the Composer to the Advanced Paste window with Alt+Win+V for additional editing options."

[[tip]]
key = "0111"
title = "Composer Search"
body = "Search within the Composer using Win+F to quickly find specific text."

[[tip]]
key = "0112"
title = "Resize Composer"
body = "Adjust the Composer\u2019s height to suit your needs by dragging its bottom edge."

[[tip]]
key = "0113"
title = "Explain Command"
body = "Learn more about your commands by Win+clicking in the Composer to open them in explainshell.com."

[[tip]]
key = "0114"
title = "Quick Command Send"
body = "Quickly send and remove commands in the Composer using Alt+Shift+-enter."

[[tip]]
key = "0115"
title = "Queue Commands"
body = "Queue up a command in the Composer to be sent after the current command finishes with Alt+-Enter."

[[tip]]
key = "0116"
title = "Draggable Tip Window"
body = "Reposition the Tip of the Day window conveniently on your screen, as it is now draggable."

[[tip]]
key = "0117"
title = "AI Chat"
body = "Tandem now has an AI Chat feature! Use \u201CWindow > AI Chats\u201D or \u201CEdit > Explain Output with AI\u201D. The assistant can interact with your terminal (with your permission) and explain command output, adding annotations right in the terminal."

[[tip]]
key = "0118"
title = "Web Browser Profiles"
body = "You can configure a profile to be a web browser! In \u201CSettings > Profiles > General\u201D, set \u201CProfile Type\u201D to \u201CWeb Browser\u201D. Key bindings, smart selection, and the password manager all work in browser sessions."
url = "https://iterm2.com/documentation-web.html"

[[tip]]
key = "0119"
title = "Adjacent Timestamps"
body = "Timestamps can now be shown next to terminal content instead of overlapping. Configure it in \u201CSettings > Profiles > Session > Timestamps\u201D. Right-click on any line and select \u201CSet Baseline for Relative Timestamps\u201D to see time elapsed between lines."

[[tip]]
key = "0120"
title = "Pretty-Print JSON"
body = "Select a block of JSON text and choose \u201CEdit > Replace Selection > Replace with Pretty-Printed JSON\u201D to make it readable. Perfect for debugging API responses and log files."

[[tip]]
key = "0121"
title = "Command Palette"
body = "Open Quickly (Shift+Win+O) is now a command palette! Just type the name of a menu item to activate it."

[[tip]]
key = "0122"
title = "Click Paths in Shell Prompts"
body = "Enable \u201CSettings > Profiles > Terminal > Click on a path in a shell prompt to open Navigator\u201D to navigate your filesystem by clicking on paths in your prompt. Requires Shell Integration."

[[tip]]
key = "0123"
title = "SSH File Browser"
body = "When connected via SSH Integration, use \u201CShell > ssh > Download Files\u201D to browse and download files from the remote host without opening a new connection. Files on SSH hosts also appear in file open/save dialogs!"
