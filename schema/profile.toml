[[setting]]
key = "Smart Selection Rules"
tab = "Advanced"
section = "Smart Selection"
label = "Smart Selection rule list"
type = "list"
default = [
  { regex = "\\S+", precision = "low", notes = "Word bounded by whitespace" },
  { regex = "([a-zA-Z0-9_]+::)+[a-zA-Z0-9_]+", precision = "normal", notes = "C++ namespace::identifier" },
  { regex = "\\~?/?([[:letter:][:number:]._-]+/+)+[[:letter:][:number:]._-]+/?", precision = "normal", notes = "Paths" },
  { regex = "@?\"(?:[^\"\\\\]|\\\\.)*\"", precision = "normal", notes = "Quoted string" },
  { regex = "([[:letter:][:number:]._]+\\.)+[[:letter:][:number:]._]+", precision = "normal", notes = "Java/Python include paths" },
  { regex = "\\bmailto:([a-z0-9A-Z_]+@)?([a-zA-Z0-9\\-]+\\.)*[a-zA-Z0-9\\-]+\\b", precision = "normal", notes = "mailto URL" },
  { regex = "@selector\\([^)]+\\)", precision = "high", notes = "Obj-C selector" },
  { regex = "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,4}\\b", precision = "high", notes = "email address" },
  { regex = "((?<!\\()https?://([a-z0-9A-Z]+(:[a-zA-Z0-9]+)?@)?([a-z0-9A-Z][-a-z0-9A-Z]*\\.)*[A-Za-z][-A-Za-z]*((:[0-9]+)?)(/[a-zA-Z0-9;/.\\-_+%?&@=#~()]*)?)|(https?://([a-z0-9A-Z]+(:[a-zA-Z0-9]+)?@)?([a-z0-9A-Z][-a-z0-9A-Z]*\\.)*[A-Za-z][-A-Za-z]*((:[0-9]+)?)(/[a-zA-Z0-9;/.\\-_+%?&@=#~(]*)?)", precision = "very_high", notes = "HTTP URL" },
  { regex = "\\bssh:([a-z0-9A-Z_]+@)?([a-zA-Z0-9\\-]+\\.)*[a-zA-Z0-9\\-]+\\b", precision = "very_high", notes = "SSH URL" },
  { regex = "\\btelnet:([a-z0-9A-Z_]+@)?([a-zA-Z0-9\\-]+\\.)*[a-zA-Z0-9\\-]+\\b", precision = "very_high", notes = "Telnet URL" },
]
default_note = "No entry in defaultValueMap (in keysWithoutDefaultValues); this is the full built-in rule list shipped in plists/SmartSelectionRules.plist, which SmartSelectionController falls back to when the profile has no Smart Selection Rules key of its own. None of the built-in rules carry an \"actions\" array (that is only added by user-created rules)."
help = "Ordered regex rules that classify what a double or triple click selects, each with a precision level (low, normal, high, very_high) and optional actions."
light_dark = false
macos_only = false

