# Tandem profile setting schema
#
# Machine-readable schema of every iTerm2 PROFILE setting, generated from a
# read-only reference clone of gnachman/iTerm2 (sources/Settings/iTermProfilePreferences.m,
# sources/Settings/Profiles/ITAddressBookMgr.h, the per-tab ProfilesXPreferencesViewController.m
# files, sources/Settings/Base.lproj/PreferencePanel.xib, and the shipped
# plists/DefaultBookmark.plist and plists/SmartSelectionRules.plist resources).
#
# Entries are grouped one table per unique plist key, in the tab order of
# docs/parity/01-profile-settings.md (General, Colors, Text, Window, Terminal,
# Session, Keys, Advanced). A handful of inventory rows collapse into a single
# entry here because they name one underlying key several times:
#   - The 14 "Window style: ..." rows (Window Type = N) are one key, "Window Type";
#     all 20 iTermWindowType values are listed in its choices.
#   - "Use Custom Window Title", "Custom Window Title", "Use Custom Tab Title", and
#     "Custom Tab Title" each appear twice in the inventory (General and Window tabs)
#     but are only wired to controls on the Window tab in the source; each is one
#     entry here with tab = "Window".
#   - "Semantic History" appears in both the Advanced tab list and its own
#     "Semantic History" tab section of the inventory; it is one entry here with
#     tab = "Advanced", since Triggers, Smart Selection, and Semantic History are
#     all edited via sheets opened from buttons on iTerm2's Advanced tab (the
#     schema's tab enum has no separate values for them).
#   - "AWDS Window Option / AWDS Window Directory" (and the Tab/Pane equivalents)
#     and "HotKey Key Code, HotKey Characters, HotKey Characters Ignoring
#     Modifiers, HotKey Modifier Flags" (and the Activated-By-Modifier pair) each
#     expand into their separate constituent keys.
# Per-row "n/a" Key-column entries (sheet-opener buttons, per-trigger-row fields,
# action choices, presets, warnings, etc.) name no plist key and are intentionally
# absent.


[[setting]]
