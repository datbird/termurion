# Tandem global setting schema (iTerm2 user defaults), same shape as schema/profile.toml.
# Defaults are iTerm2's, from sources/Settings/iTermPreferences.m (defaultValueMap).
# Milestone 3b covers the Keys and Pointer panes; milestone 13 completes the rest.

[[setting]]
key = "GlobalKeyMap"
tab = "Keys"
section = "Key Bindings"
label = "Key bindings"
type = "dict"
default = {}
default_note = "The factory map is iTerm2's DefaultGlobalKeyMap.plist (schema/keymaps.toml [global])."
help = "Global keystroke to action bindings."

[[setting]]
key = "Leader"
tab = "Keys"
section = "Key Bindings"
label = "Leader"
type = "string"
default = ""
help = "A prefix keystroke; bindings made after it need the leader first, tmux-prefix style."

[[setting]]
key = "LanguageAgnosticKeyBindings"
tab = "Keys"
section = "Key Bindings"
label = "Interpret key bindings based on physical key, ignoring input language"
type = "bool"
default = false
help = "Matches key bindings by physical key position instead of by the character the input language produces."

[[setting]]
key = "SwitchTabModifier"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Shortcut to select a tab"
type = "enum"
default = 4
choices = [ { value = 9, label = "No Shortcut" }, { value = 5, label = "Alt+Number" }, { value = 4, label = "Win+Number" }, { value = 6, label = "Win+Alt+Number" }, { value = 1, label = "Ctrl+Number" } ]
help = "Modifier held with a number key to switch to tab N."

[[setting]]
key = "SwitchPaneModifier"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Shortcut to choose a split pane"
type = "enum"
default = 9
choices = [ { value = 9, label = "No Shortcut" }, { value = 5, label = "Alt+Number" }, { value = 4, label = "Win+Number" }, { value = 6, label = "Win+Alt+Number" }, { value = 1, label = "Ctrl+Number" } ]
help = "Modifier held with a number key to jump to split pane N."

[[setting]]
key = "SwitchWindowModifier"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Shortcut to activate a window"
type = "enum"
default = 6
choices = [ { value = 9, label = "No Shortcut" }, { value = 5, label = "Alt+Number" }, { value = 4, label = "Win+Number" }, { value = 6, label = "Win+Alt+Number" }, { value = 1, label = "Ctrl+Number" } ]
help = "Modifier held with a number key to switch to window N."

[[setting]]
key = "UseVirtualKeyCodesForDetectingDigits"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Emulate U.S. Keyboard"
type = "bool"
default = false
help = "Number shortcuts use the U.S. positions of the digit keys, whatever the input layout."

[[setting]]
key = "LeftControl"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap left Control key to"
type = "enum"
default = 11
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical left Control key acts as."

[[setting]]
key = "RightControl"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap right Control key to"
type = "enum"
default = 12
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical right Control key acts as."

[[setting]]
key = "LeftOption"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap left Alt key to"
type = "enum"
default = 2
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical left Alt (Option) key acts as."

[[setting]]
key = "RightOption"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap right Alt key to"
type = "enum"
default = 3
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical right Alt (Option) key acts as."

[[setting]]
key = "LeftCommand"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap left Win key to"
type = "enum"
default = 7
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical left Win (Command) key acts as."

[[setting]]
key = "RightCommand"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap right Win key to"
type = "enum"
default = 8
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical right Win (Command) key acts as."

[[setting]]
key = "FunctionKey"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap fn key to"
type = "enum"
default = 10
choices = [ { value = 10, label = "Function" } ]
macos_only = true
help = "Windows cannot see the fn key."

[[setting]]
key = "RemapModifiersGlobally"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap modifiers globally"
type = "bool"
default = true
help = "iTerm2 applies the remapping only while it is the active app either way; Tandem does the same."

[[setting]]
key = "CommandSelection"
tab = "Pointer"
section = "General"
label = "Win-click opens filename/URL"
type = "bool"
default = true
help = "Win-click opens the clicked file, folder, or URL (Semantic History)."

[[setting]]
key = "DoubleClickPerformsSmartSelection"
tab = "Pointer"
section = "Selection"
label = "Double-click performs smart selection"
type = "bool"
default = false
help = "A double click makes a Smart Selection and a quadruple click selects a word, the other way round from the default. iTerm2 keeps this under General > Selection."

[[setting]]
key = "EnterCopyModeAutomatically"
tab = "Pointer"
section = "Selection"
label = "Automatically enter copy mode on Shift+Arrow key with selection"
type = "bool"
default = true
help = "With text selected, Shift with an arrow, Home, End, Page Up, or Page Down starts Copy Mode at that end of the selection."

[[setting]]
key = "Selection Respects Soft Boundaries"
tab = "Pointer"
section = "Selection"
label = "Selection respects soft boundaries"
type = "bool"
default = false
help = "Double-click and Smart Selection stop at vertical pane dividers drawn by tmux or vim (Edit > Selection Respects Soft Boundaries)."

[[setting]]
key = "PassOnControlClick"
tab = "Pointer"
section = "General"
label = "Ctrl-click reported to apps, does not open menu"
type = "bool"
default = false
help = "A Ctrl-click goes to a mouse-reporting app instead of opening the context menu."

[[setting]]
key = "ReportRightClick"
tab = "Pointer"
section = "General"
label = "Right click reported to apps, does not open menu"
type = "bool"
default = false
help = "A right click goes to a mouse-reporting app instead of running its binding."

[[setting]]
key = "OptionClickMovesCursor"
tab = "Pointer"
section = "General"
label = "Alt-click moves cursor"
type = "bool"
default = true
help = "An Alt-click moves the cursor to the clicked cell with arrow keys."

[[setting]]
key = "ThreeFingerEmulates"
tab = "Pointer"
section = "General"
label = "Three-finger tap emulates middle click"
type = "bool"
default = false
macos_only = true
help = "macOS trackpad gesture; Windows keeps three-finger gestures for itself."

[[setting]]
key = "FocusFollowsMouse"
tab = "Pointer"
section = "General"
label = "Focus follows mouse"
type = "bool"
default = false
help = "The pane under the pointer takes keyboard focus without a click."

[[setting]]
key = "FocusOnRightOrMiddleClick"
tab = "Pointer"
section = "General"
label = "Focus window after right or middle click"
type = "bool"
default = false
help = "A right or middle click also focuses the clicked pane."

[[setting]]
key = "ReportHorizontalScrollEvents"
tab = "Pointer"
section = "General"
label = "Mouse reporting supports horizontal scrolling"
type = "bool"
default = true
help = "Horizontal wheel movement goes to mouse-reporting apps."

[[setting]]
key = "PointerActions"
tab = "Pointer"
section = "Bindings"
label = "Pointer bindings"
type = "dict"
default = {}
default_note = "The factory bindings are iTerm2's DefaultPointerActions.plist (schema/keymaps.toml [pointer])."
help = "Mouse button and click count bindings."

[[setting]]
key = "Mark Alert Action"
tab = "Marks"
section = "Alerts"
label = "Mark alert"
type = "enum"
default = "Post Notification"
choices = [ { value = "Post Notification", label = "Post Notification" }, { value = "Modal Alert", label = "Show Modal Alert Box" }, { value = "Ring Bell", label = "Play a Sound" } ]
help = "What Alert on Next Mark does when a mark is set (Edit > Marks and Annotations > Alerts)."

[[setting]]
key = "Alert On Marks in Offscreen Sessions"
tab = "Marks"
section = "Alerts"
label = "Alert on Marks in Offscreen Sessions"
type = "bool"
default = false
help = "Alerts on every mark in a session that is not in the selected tab."

[[setting]]
key = "findMode_iTerm"
tab = "Find"
section = "Find"
label = "Find mode"
type = "enum"
default = 0
choices = [ { value = 0, label = "Smart Case" }, { value = 1, label = "Case Sensitive" }, { value = 2, label = "Case Insensitive" }, { value = 3, label = "Case-Sensitive Regex" }, { value = 4, label = "Case-Insensitive Regex" } ]
help = "The find bar's search mode, picked from its mode menu. Shared by every session."

[[setting]]
key = "AllowClipboardAccess"
tab = "General"
section = "Selection"
label = "Applications in terminal may access clipboard"
type = "bool"
default = false
help = "Lets programs put text on the clipboard with OSC 52 and OSC 1337 Copy. A program that asks to read the clipboard is asked about separately."

[[setting]]
key = "maximumBytesToProvideToPythonAPI"
tab = "Advanced"
section = "General"
label = "Maximum number of bytes of selection to provide to Python API."
type = "int"
default = 100
help = "Maximum number of bytes of selection to provide to Python API.\nA large value here can cause performance issues when you have a big selection."

[[setting]]
key = "disablePotentiallyInsecureEscapeSequences"
tab = "Advanced"
section = "General"
label = "Disable potentially insecure escape sequences"
type = "bool"
default = false
help = "Ignores escape sequences that can change settings, reach the clipboard, save files, or report window and screen details (iTerm2's trust gate)."

[[setting]]
key = "onePasswordAccount"
tab = "Advanced"
section = "General"
label = "1Password account name"
type = "string"
default = ""
help = "1Password account name.\nThis is used if you\u2019ve enabled the 1Password integration in the password manager. Use `op account list` to get the list of accounts. This can be an account shorthand, sign-in address, account ID, or user ID."

[[setting]]
key = "defaultWideMode"
tab = "Advanced"
section = "General"
label = "Rendered documents start in Wide mode"
type = "bool"
default = false
help = "Documents shown rendered in place (Render Selection Natively, OSC 1337 Block render=1, File= text) start without wrapping, scrolled sideways."

[[setting]]
key = "nativeRenderingCSSDark"
tab = "Advanced"
section = "General"
label = "Rendered code theme (dark background)"
type = "string"
default = ""
help = "A CSS file of highlight.js class colors for documents shown rendered in place on a dark background. ${fg}, ${bg}, and ${red} and the other ANSI color names fill in from the profile. Empty: the built-in theme."

[[setting]]
key = "nativeRenderingCSSLight"
tab = "Advanced"
section = "General"
label = "Rendered code theme (light background)"
type = "string"
default = ""
help = "As the dark one, for a light background."

[[setting]]
key = "screenshotSaveLocation"
tab = "Advanced"
section = "General"
label = "Screenshot save folder"
type = "string"
default = ""
help = "Folder where Save in the Make Screenshot panel writes files (a ~ start means your user folder). Empty or not a folder: the Desktop."

[[setting]]
key = "ShowNewOutputIndicator"
tab = "Appearance"
section = "Tabs"
label = "Show new-output indicator"
type = "bool"
default = true
help = "A tab whose session printed something you have not looked at shows the new-output mark."

[[setting]]
key = "silentUserNotifications"
tab = "Advanced"
section = "Notifications"
label = "Notifications make no sound"
type = "bool"
default = false
help = "Notifications from Tandem show without the Windows notification sound."

[[setting]]
key = "simpleNotifications"
tab = "Advanced"
section = "Notifications"
label = "Escape-sequence notifications show only their message"
type = "bool"
default = false
help = "An OSC 9 or OSC 1337 notification without a title shows only its message, without the session name and tab number."

[[setting]]
key = "sessionEndMessageText"
tab = "Advanced"
section = "Notifications"
label = "Session Ended notification title"
type = "string"
default = ""
help = "The title of the notification that a session ended. Empty: \"Session Ended\"."

[[setting]]
key = "ShowSessionStatusInTabSubtitle"
tab = "Appearance"
section = "Tabs"
label = "Show session status in tab"
type = "bool"
default = true
help = "Shows the status text a program sets with OSC 21337 in its tab, in the status color."

[[setting]]
key = "PerPaneBackgroundImage"
tab = "Appearance"
section = "Panes"
label = "Separate background images per pane"
type = "bool"
default = true
help = "Each split pane shows its own profile's background image; off, the active pane's image spans the whole tab."

[[setting]]
key = "Print In Black And White"
tab = "General"
section = "Printing"
label = "Print in black and white"
type = "bool"
default = true
help = "Shell > Print leaves out text and background colors."

[[setting]]
key = "fileDropCoprocess"
tab = "Advanced"
section = "General"
label = "Coprocess for dropped files"
type = "string"
default = ""
help = "A command run as a silent coprocess when files are dropped on a session; \\(filenames) becomes the dropped paths. Empty: the paths are pasted."

[[setting]]
key = "disableTopRightIndicators"
tab = "Advanced"
section = "General"
label = "Hide the indicators at the top right of a session"
type = "bool"
default = false
help = "Hides the icons in a session's top-right corner, such as the one that shows a coprocess is running."

[[setting]]
key = "showAutomaticProfileSwitchingBanner"
tab = "Advanced"
section = "General"
label = "Say when Automatic Profile Switching changes the profile"
type = "bool"
default = true
help = "Shows \"Switched to profile\" when a session's profile changes because of an Automatic Profile Switching rule."

[[setting]]
key = "preserveFontSizeOnAutomaticProfileSwitch"
tab = "Advanced"
section = "General"
label = "Keep the text size when Automatic Profile Switching changes the profile"
type = "bool"
default = true
help = "A session that was made bigger or smaller keeps that change when its profile switches."

[[setting]]
key = "NoSyncEnableAutomaticProfileSwitchingLogging"
tab = "Advanced"
section = "General"
label = "Write Automatic Profile Switching debug logs"
type = "bool"
default = false
help = "Each Automatic Profile Switching decision goes to the Script Console's \"Automatic Profile Switching\" entry (Scripts > Manage > Console), as in iTerm2."

[[setting]]
key = "WindowNumber"
tab = "Appearance"
section = "Windows"
label = "Show window number"
type = "bool"
default = true
help = "Window titles start with the window's number (1, 2, ...), which Alt+Win+number switches to."

[[setting]]
key = "openProfilesInNewWindow"
tab = "Advanced"
section = "General"
label = "Profiles menu opens new windows"
type = "bool"
default = false
help = "A profile picked in the Profiles menu opens in a new window, and with Alt held in a new tab (the reverse of the usual)."

[[setting]]
key = "WindowPlacement"
tab = "Appearance"
section = "Windows"
label = "New window placement"
type = "enum"
default = 3
choices = [ { value = 0, label = "Let Windows decide the position of new windows and use size from profile" }, { value = 1, label = "Smart Window Placement" }, { value = 2, label = "Remember the size and position of previously closed windows" }, { value = 3, label = "Remember the position of previously closed windows and use size from profile" } ]
help = "Where a new window opens. Smart Window Placement puts new windows where the most free space is available. Saved frames are kept per profile."

[[setting]]
key = "DimBackgroundWindows"
tab = "Appearance"
section = "Windows"
label = "Dim background windows"
type = "bool"
default = false
help = "Windows that do not have the keyboard focus are dimmed. Off: only their inactive split panes dim."

[[setting]]
key = "OnlyWhenMoreTabs"
tab = "General"
section = "Closing"
label = "Confirm closing multiple sessions"
type = "bool"
default = true
help = "Closing a tab or window with more than one running session asks first."

[[setting]]
key = "moveLeftAfterClosingTab"
tab = "Advanced"
section = "General"
label = "Select the tab to the left after closing a tab"
type = "bool"
default = false
help = "After the selected tab closes, the tab to its left is selected instead of the one to its right."

[[setting]]
key = "PromptOnQuit"
tab = "General"
section = "Closing"
label = "Confirm \"Quit Tandem\""
type = "bool"
default = true
help = "Quitting asks first while a terminal window is open."

[[setting]]
key = "PromptOnQuitEvenIfThereAreNoWindows"
tab = "General"
section = "Closing"
label = "Even if there are no windows"
type = "bool"
default = false
help = "Quitting asks first even with no terminal window open (only with Confirm \"Quit Tandem\")."

[[setting]]
key = "QuitWhenAllWindowsClosed"
tab = "General"
section = "Closing"
label = "Quit when all windows are closed"
type = "bool"
default = false
help = "Tandem ends when its last window closes. On Windows a Tandem with no window cannot be reached, so Tandem also ends when this is off, until hotkey windows (milestone 7e) can bring one back."

[[setting]]
key = "NeverBlockSystemShutdown"
tab = "General"
section = "Closing"
label = "Disable all confirmations on system shutdown, restart, and log out"
type = "bool"
default = false
help = "Windows shutting down, restarting, or signing out never waits for Tandem's questions."

[[setting]]
key = "OpenBookmark"
tab = "General"
section = "Startup"
label = "Open profiles window"
type = "bool"
default = false
help = "The Profiles window also opens when Tandem starts."

[[setting]]
key = "OpenArrangementAtStartup"
tab = "General"
section = "Startup"
label = "Open default window arrangement"
type = "bool"
default = false
help = "Tandem starts with the default window arrangement (Window > Arrangements) instead of one window."

[[setting]]
key = "OpenNoWindowsAtStartup"
tab = "General"
section = "Startup"
label = "Only restore hotkey window"
type = "bool"
default = false
help = "Tandem starts with only its hotkey windows. With no hotkey window a window opens anyway, since Windows would show nothing."

[[setting]]
key = "AlwaysOpenWindowAtStartup"
tab = "General"
section = "Startup"
label = "Always open at least one terminal window at startup"
type = "bool"
default = false
help = "The existence of hotkey windows disables opening a window at startup. This opens one anyway."

[[setting]]
key = "IRMemory"
tab = "General"
section = "Instant Replay"
label = "Memory usage per session (in MB)"
type = "int"
default = 4
min = 0
max = 1000
help = "Megabytes of memory each session keeps for Instant Replay. A change applies to sessions started after it."

[[setting]]
key = "EnableAPIServer"
tab = "General"
section = "Python API"
label = "Enable Python API"
type = "bool"
default = false
help = "Runs the Python API server on 127.0.0.1 and [::1] port 1912 so scripts can control Tandem. Turning it off disconnects every script."

[[setting]]
key = "API Authentication Method"
tab = "General"
section = "Python API"
label = "Authentication method for Python API"
type = "enum"
choices = [{ value = 0, label = "Require a cookie" }, { value = 1, label = "Allow all apps to connect" }]
default = 0
help = "Whether scripts need a cookie (scripts started in a Tandem session with setCookie on have one), or any program running as you may connect. The choice is stored as a file that the iterm2 Python package also reads."

[[setting]]
key = "UseCustomScriptsFolder"
tab = "General"
section = "Python API"
label = "Custom Python API Scripts Folder"
type = "bool"
default = false
help = "Tandem looks for Python API scripts in this folder instead of %APPDATA%\\Tandem\\Scripts. It must exist and have no spaces in its path. Network paths are not supported."

[[setting]]
key = "CustomScriptsFolder"
tab = "General"
section = "Python API"
label = "Custom folder for Python API scripts"
type = "string"
default = ""
help = "Tandem looks for Python API scripts in this folder instead of %APPDATA%\\Tandem\\Scripts. It must exist and have no spaces in its path. Network paths are not supported."

[[setting]]
key = "openNewWindowAtStartup"
tab = "Advanced"
section = "General"
label = "Open a new window when Tandem starts"
type = "bool"
default = true
help = "Tandem opens a terminal window at launch unless the Startup settings say otherwise."

[[setting]]
key = "runJobsInServers"
tab = "Advanced"
section = "Session"
label = "Enable session restoration"
type = "bool"
default = true
help = "Session restoration runs jobs in a separate process (tandem-host). They survive crashes, force quits, and upgrades. You must restart Tandem for this change to take effect."

[[setting]]
key = "killJobsInServersOnQuit"
tab = "Advanced"
section = "Session"
label = "Quit ends all running jobs"
type = "bool"
default = true
help = "A Quit you choose (Cmd+Q) ends all running jobs. Applies only when session restoration is on."

[[setting]]
key = "showSessionRestoredBanner"
tab = "Advanced"
section = "Session"
label = "Show the Session Contents Restored banner"
type = "bool"
default = true
help = "When restoring a session without restoring a running job, draw a banner saying \"Session Contents Restored\" below the restored contents."

[[setting]]
key = "composerClearSequence"
tab = "Advanced"
section = "Session"
label = "Hex codes to send to clear the command line when entering the composer"
type = "string"
default = "0x15 0x0b"
help = "Hex codes to send to clear the command line when entering the composer.\n0x15 is ^U, 0x0b is ^K."

[[setting]]
key = "alwaysUseStatusBarComposer"
tab = "Advanced"
section = "Session"
label = "Use the status bar composer when a status bar is present"
type = "bool"
default = false
help = "Temporarily add a composer to the status bar instead of opening the large composer view when a status bar is present."

[[setting]]
key = "timeoutForDaemonAttachment"
tab = "Advanced"
section = "Session"
label = "Seconds to wait for the session host at startup"
type = "float"
default = 10.0
help = "How long to wait when trying to attach to the session host at startup when restoring windows (in seconds)?"

[[setting]]
key = "translateScreenToXterm"
tab = "Advanced"
section = "Terminal"
label = "Support TERM=screen"
type = "bool"
default = true
help = "Support TERM=screen\nMost notably, this fixes italics replacing inverse text."

[[setting]]
key = "convertItalicsToReverseVideoForTmux"
tab = "Advanced"
section = "Terminal"
label = "Convert italics to reverse video in tmux integration?"
type = "bool"
default = true
help = "Convert italics to reverse video in tmux integration?\nThis is effective when the default TERM reported by tmux matches *screen*."

[[setting]]
key = "convertItalicsToReverseVideoForTmuxBugwardsCompatible"
tab = "Advanced"
section = "Terminal"
label = "Convert italics to reverse video in tmux integration, even when TERM matches *tmux*?"
type = "bool"
default = false
help = "Convert italics to reverse video in tmux integration, even when TERM matches *tmux*?\nThis was the default behavior for a long time, but it was incorrect. The conversion should only be done when TERM matches *screen*."

[[setting]]
key = "echoProbeDuration"
tab = "Advanced"
section = "Terminal"
label = "Seconds to wait while testing if echo is on"
type = "float"
default = 0.5
help = "Amount of time to wait while testing if echo is on (seconds).\nThis is used by the password manager to ensure you're at a password prompt. Set to 0 to disable echo probe."

[[setting]]
key = "disablePasswordManagerAnimations"
tab = "Advanced"
section = "Terminal"
label = "Disable animations for showing/hiding password manager"
type = "bool"
default = false
help = "Disable animations for showing/hiding password manager."

[[setting]]
key = "detectPasswordInput"
tab = "Advanced"
section = "Terminal"
label = "Show key at cursor at password prompt?"
type = "bool"
default = true
help = "Show key at cursor at password prompt?"

[[setting]]
key = "detectPasswordInputDebounce"
tab = "Advanced"
section = "Terminal"
label = "How long (seconds) terminal echo must remain disabled before Tandem treats it as a password prompt."
type = "float"
default = 0.2
help = "How long (seconds) terminal echo must remain disabled before Tandem treats it as a password prompt.\nThis prevents shell scripts that briefly turn off echo (e.g. while reading the response to an OSC report request) from triggering the password manager. Set to 0 to disable debouncing."

[[setting]]
key = "RequireAuthenticationToOpenPasswordManager"
tab = "Advanced"
section = "Password Manager"
label = "Require authentication to open the password manager"
type = "bool"
default = true
help = "Asks for Windows Hello (or your Windows password) before the password manager opens. The same setting is in the password manager's gear menu; it is here too so a failed prompt can never lock you out."

[[setting]]
key = "RequireAuthenticationAfterScreenLocks"
tab = "Advanced"
section = "Password Manager"
label = "Require authentication after the screen locks"
type = "bool"
default = false
help = "Locking the screen ends the password manager's authentication, and closes any open password manager while authentication is required."

[[setting]]
key = "RequireAuthenticationOnEveryPasswordManagerOpen"
tab = "Advanced"
section = "Password Manager"
label = "Require authentication on every open"
type = "bool"
default = false
help = "Asks again each time the password manager opens, instead of once until Tandem quits or the screen locks."

