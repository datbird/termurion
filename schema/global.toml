# Tandem global setting schema (iTerm2 user defaults), same shape as schema/profile.toml.
# Defaults are iTerm2's, from sources/Settings/iTermPreferences.m (defaultValueMap).
# Milestone 3b covers the Keys and Pointer panes; milestone 13 completes the rest.

[[setting]]
key = "GlobalKeyMap"
tab = "Keys"
section = "Key Bindings"
label = "Key bindings"
type = "dict"
default = {}
default_note = "The factory map is iTerm2's DefaultGlobalKeyMap.plist (schema/keymaps.toml [global])."
help = "Global keystroke to action bindings."

[[setting]]
key = "Leader"
tab = "Keys"
section = "Key Bindings"
label = "Leader"
type = "string"
default = ""
help = "A prefix keystroke; bindings made after it need the leader first, tmux-prefix style."

[[setting]]
key = "LanguageAgnosticKeyBindings"
tab = "Keys"
section = "Key Bindings"
label = "Interpret key bindings based on physical key, ignoring input language"
type = "bool"
default = false
help = "Matches key bindings by physical key position instead of by the character the input language produces."

[[setting]]
key = "SwitchTabModifier"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Shortcut to select a tab"
type = "enum"
default = 4
choices = [ { value = 9, label = "No Shortcut" }, { value = 5, label = "Alt+Number" }, { value = 4, label = "Win+Number" }, { value = 6, label = "Win+Alt+Number" }, { value = 1, label = "Ctrl+Number" } ]
help = "Modifier held with a number key to switch to tab N."

[[setting]]
key = "SwitchPaneModifier"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Shortcut to choose a split pane"
type = "enum"
default = 9
choices = [ { value = 9, label = "No Shortcut" }, { value = 5, label = "Alt+Number" }, { value = 4, label = "Win+Number" }, { value = 6, label = "Win+Alt+Number" }, { value = 1, label = "Ctrl+Number" } ]
help = "Modifier held with a number key to jump to split pane N."

[[setting]]
key = "SwitchWindowModifier"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Shortcut to activate a window"
type = "enum"
default = 6
choices = [ { value = 9, label = "No Shortcut" }, { value = 5, label = "Alt+Number" }, { value = 4, label = "Win+Number" }, { value = 6, label = "Win+Alt+Number" }, { value = 1, label = "Ctrl+Number" } ]
help = "Modifier held with a number key to switch to window N."

[[setting]]
key = "UseVirtualKeyCodesForDetectingDigits"
tab = "Keys"
section = "Navigation Shortcuts"
label = "Emulate U.S. Keyboard"
type = "bool"
default = false
help = "Number shortcuts use the U.S. positions of the digit keys, whatever the input layout."

[[setting]]
key = "LeftControl"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap left Control key to"
type = "enum"
default = 11
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical left Control key acts as."

[[setting]]
key = "RightControl"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap right Control key to"
type = "enum"
default = 12
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical right Control key acts as."

[[setting]]
key = "LeftOption"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap left Alt key to"
type = "enum"
default = 2
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical left Alt (Option) key acts as."

[[setting]]
key = "RightOption"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap right Alt key to"
type = "enum"
default = 3
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical right Alt (Option) key acts as."

[[setting]]
key = "LeftCommand"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap left Win key to"
type = "enum"
default = 7
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical left Win (Command) key acts as."

[[setting]]
key = "RightCommand"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap right Win key to"
type = "enum"
default = 8
choices = [ { value = 11, label = "Left Control" }, { value = 12, label = "Right Control" }, { value = 2, label = "Left Alt" }, { value = 3, label = "Right Alt" }, { value = 7, label = "Left Win" }, { value = 8, label = "Right Win" }, { value = 9, label = "None" } ]
help = "What the physical right Win (Command) key acts as."

[[setting]]
key = "FunctionKey"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap fn key to"
type = "enum"
default = 10
choices = [ { value = 10, label = "Function" } ]
macos_only = true
help = "Windows cannot see the fn key."

[[setting]]
key = "RemapModifiersGlobally"
tab = "Keys"
section = "Remap Modifiers"
label = "Remap modifiers globally"
type = "bool"
default = true
help = "iTerm2 applies the remapping only while it is the active app either way; Tandem does the same."

[[setting]]
key = "CommandSelection"
tab = "Pointer"
section = "General"
label = "Win-click opens filename/URL"
type = "bool"
default = true
help = "Win-click opens the clicked file, folder, or URL (Semantic History)."

[[setting]]
key = "DoubleClickPerformsSmartSelection"
tab = "Pointer"
section = "Selection"
label = "Double-click performs smart selection"
type = "bool"
default = false
help = "A double click makes a Smart Selection and a quadruple click selects a word, the other way round from the default. iTerm2 keeps this under General > Selection."

[[setting]]
key = "EnterCopyModeAutomatically"
tab = "Pointer"
section = "Selection"
label = "Automatically enter copy mode on Shift+Arrow key with selection"
type = "bool"
default = true
help = "With text selected, Shift with an arrow, Home, End, Page Up, or Page Down starts Copy Mode at that end of the selection."

[[setting]]
key = "Selection Respects Soft Boundaries"
tab = "Pointer"
section = "Selection"
label = "Selection respects soft boundaries"
type = "bool"
default = false
help = "Double-click and Smart Selection stop at vertical pane dividers drawn by tmux or vim (Edit > Selection Respects Soft Boundaries)."

[[setting]]
key = "PassOnControlClick"
tab = "Pointer"
section = "General"
label = "Ctrl-click reported to apps, does not open menu"
type = "bool"
default = false
help = "A Ctrl-click goes to a mouse-reporting app instead of opening the context menu."

[[setting]]
key = "ReportRightClick"
tab = "Pointer"
section = "General"
label = "Right click reported to apps, does not open menu"
type = "bool"
default = false
help = "A right click goes to a mouse-reporting app instead of running its binding."

[[setting]]
key = "OptionClickMovesCursor"
tab = "Pointer"
section = "General"
label = "Alt-click moves cursor"
type = "bool"
default = true
help = "An Alt-click moves the cursor to the clicked cell with arrow keys."

[[setting]]
key = "ThreeFingerEmulates"
tab = "Pointer"
section = "General"
label = "Three-finger tap emulates middle click"
type = "bool"
default = false
macos_only = true
help = "macOS trackpad gesture; Windows keeps three-finger gestures for itself."

[[setting]]
key = "FocusFollowsMouse"
tab = "Pointer"
section = "General"
label = "Focus follows mouse"
type = "bool"
default = false
help = "The pane under the pointer takes keyboard focus without a click."

[[setting]]
key = "FocusOnRightOrMiddleClick"
tab = "Pointer"
section = "General"
label = "Focus window after right or middle click"
type = "bool"
default = false
help = "A right or middle click also focuses the clicked pane."

[[setting]]
key = "ReportHorizontalScrollEvents"
tab = "Pointer"
section = "General"
label = "Mouse reporting supports horizontal scrolling"
type = "bool"
default = true
help = "Horizontal wheel movement goes to mouse-reporting apps."

[[setting]]
key = "PointerActions"
tab = "Pointer"
section = "Bindings"
label = "Pointer bindings"
type = "dict"
default = {}
default_note = "The factory bindings are iTerm2's DefaultPointerActions.plist (schema/keymaps.toml [pointer])."
help = "Mouse button and click count bindings."

[[setting]]
key = "Mark Alert Action"
tab = "Marks"
section = "Alerts"
label = "Mark alert"
type = "enum"
default = "Post Notification"
choices = [ { value = "Post Notification", label = "Post Notification" }, { value = "Modal Alert", label = "Show Modal Alert Box" }, { value = "Ring Bell", label = "Play a Sound" } ]
help = "What Alert on Next Mark does when a mark is set (Edit > Marks and Annotations > Alerts)."

[[setting]]
key = "Alert On Marks in Offscreen Sessions"
tab = "Marks"
section = "Alerts"
label = "Alert on Marks in Offscreen Sessions"
type = "bool"
default = false
help = "Alerts on every mark in a session that is not in the selected tab."

[[setting]]
key = "findMode_iTerm"
tab = "Find"
section = "Find"
label = "Find mode"
type = "enum"
default = 0
choices = [ { value = 0, label = "Smart Case" }, { value = 1, label = "Case Sensitive" }, { value = 2, label = "Case Insensitive" }, { value = 3, label = "Case-Sensitive Regex" }, { value = 4, label = "Case-Insensitive Regex" } ]
help = "The find bar's search mode, picked from its mode menu. Shared by every session."

[[setting]]
key = "CopySelection"
tab = "General"
section = "Selection"
label = "Copy to clipboard on selection"
type = "bool"
default = true
help = "Copy to clipboard on selection"

[[setting]]
key = "CopyLastNewline"
tab = "General"
section = "Selection"
label = "Copied text includes trailing newline"
type = "bool"
default = false
help = "Copied text includes trailing newline"

[[setting]]
key = "AllowClipboardAccess"
tab = "General"
section = "Selection"
label = "Applications in terminal may access clipboard"
type = "bool"
default = false
help = "Lets programs put text on the clipboard with OSC 52 and OSC 1337 Copy. A program that asks to read the clipboard is asked about separately."

[[setting]]
key = "WordSelectionMode"
tab = "General"
section = "Selection"
label = "Characters considered part of a word"
type = "enum"
default = 0
choices = [ { value = 0, label = "List of Characters" }, { value = 1, label = "Regular Expression" } ]
help = "How double-click word selection decides what a word is: a list of extra characters, or a regular expression."

[[setting]]
key = "WordCharacters"
tab = "General"
section = "Selection"
label = "Characters considered part of a word"
type = "string"
default = "/-+\\~_."
help = "Characters considered part of a word"

[[setting]]
key = "WordSelectionRegexPattern"
tab = "General"
section = "Selection"
label = "Characters considered part of a word"
type = "string"
default = "-|\\+|\\\\|~|_"
help = "Characters considered part of a word"

[[setting]]
key = "TripleClickSelectsFullWrappedLines"
tab = "General"
section = "Selection"
label = "Triple-click selects entire wrapped lines"
type = "bool"
default = true
help = "If disabled, then triple click selects one line as it appears onscreen."

[[setting]]
key = "ClickToSelectCommand"
tab = "General"
section = "Selection"
label = "Clicking on a command selects it to restrict Find and Filter"
type = "bool"
default = true
help = "When this is enabled, you can click on a command or its output to restrict Find and Filter to its output. The selected command gets highlighted and other commands get dimmed. This requires shell integration to be installed."

[[setting]]
key = "WrapDroppedFilenamesInQuotesWhenPasting"
tab = "General"
section = "Selection"
label = "When pasting a dropped filename, wrap it in double quotes"
type = "bool"
default = false
help = "When pasting a dropped filename, wrap it in double quotes"

[[setting]]
key = "maximumBytesToProvideToPythonAPI"
tab = "Advanced"
section = "General"
label = "Maximum number of bytes of selection to provide to Python API."
type = "int"
default = 100
help = "Maximum number of bytes of selection to provide to Python API.\nA large value here can cause performance issues when you have a big selection."

[[setting]]
key = "disablePotentiallyInsecureEscapeSequences"
tab = "Advanced"
section = "General"
label = "Disable potentially insecure escape sequences."
type = "bool"
default = false
help = "Disable potentially insecure escape sequences.\nSome features of Tandem expand the surface area for security issues. Consider turning this on when viewing untrusted content. The following custom escape sequences will be disabled: RemoteHost, StealFocus, CurrentDir, SetProfile, CopyToClipboard, EndCopy, File, SetBackgroundImageFile, OSC 6\u2019s proxy icon-changing feature. The following DEC sequences are disabled: DECRQCRA. The following xterm extensions are disabled: Window Title Reporting, Icon Title Reporting. This will break displaying inline images, file download, some shell integration features, and other features."

[[setting]]
key = "onePasswordAccount"
tab = "Advanced"
section = "General"
label = "1Password account name."
type = "string"
default = ""
help = "1Password account name.\nThis is used if you\u2019ve enabled the 1Password integration in the password manager. Use `op account list` to get the list of accounts. This can be an account shorthand, sign-in address, account ID, or user ID."

[[setting]]
key = "defaultWideMode"
tab = "Advanced"
section = "Terminal"
label = "When rendering natively, use wide mode by default?"
type = "bool"
default = false
help = "When rendering natively, use wide mode by default?"

[[setting]]
key = "nativeRenderingCSSDark"
tab = "Advanced"
section = "Drawing"
label = "Path to CSS file to customize native drawing (for dark background colors)."
type = "string"
default = ""
help = "Path to CSS file to customize native drawing (for dark background colors)."

[[setting]]
key = "nativeRenderingCSSLight"
tab = "Advanced"
section = "Drawing"
label = "Path to CSS file to customize native drawing (for light background colors)."
type = "string"
default = ""
help = "Path to CSS file to customize native drawing (for light background colors)."

[[setting]]
key = "screenshotSaveLocation"
tab = "Advanced"
section = "General"
label = "Folder where the \u201cSave\u201d button in the screenshot window writes files."
type = "string"
default = ""
help = "Folder where the \u201cSave\u201d button in the screenshot window writes files.\nLeave empty to save to the Desktop. The \u201cSave As\u2026\u201d button ignores this and always prompts for a location."

[[setting]]
key = "HideTab"
tab = "Appearance"
section = "Tabs"
label = "Show tab bar even when there is only one tab"
type = "bool"
default = true
inverted = true
help = "With one tab in a window the tab bar is still shown; off, it appears only when there are two or more tabs."

[[setting]]
key = "HideTabNumber"
tab = "Appearance"
section = "Tabs"
label = "Show tab numbers"
type = "bool"
default = false
inverted = true
help = "Each tab shows the shortcut that selects it, such as Win+1, at its right end."

[[setting]]
key = "TabsHaveCloseButton"
tab = "Appearance"
section = "Tabs"
label = "Tabs have close buttons"
type = "bool"
default = true
help = "Each tab has a button that closes it."

[[setting]]
key = "HideActivityIndicator"
tab = "Appearance"
section = "Tabs"
label = "Show activity indicator"
type = "bool"
default = false
inverted = true
help = "A background tab whose session is printing shows a spinner."

[[setting]]
key = "ShowNewOutputIndicator"
tab = "Appearance"
section = "Tabs"
label = "Show new-output indicator"
type = "bool"
default = true
help = "A tab whose session printed something you have not looked at shows the new-output mark."

[[setting]]
key = "silentUserNotifications"
tab = "Advanced"
section = "General"
label = "System notifications should be silent."
type = "bool"
default = false
help = "System notifications should be silent."

[[setting]]
key = "simpleNotifications"
tab = "Advanced"
section = "General"
label = "Omit session identifier from notifications."
type = "bool"
default = false
help = "Omit session identifier from notifications.\nWhen enabled, notifications will only show the message without the session name and tab number prefix."

[[setting]]
key = "sessionEndMessageText"
tab = "Advanced"
section = "Session"
label = "Text displayed when a session ends. Leave empty to use default."
type = "string"
default = ""
help = "Text displayed when a session ends. Leave empty to use default."

[[setting]]
key = "ShowSessionStatusInTabSubtitle"
tab = "Appearance"
section = "Tabs"
label = "Show session status in tab"
type = "bool"
default = true
help = "The status text a program sets with OSC 21337 joins the tab's subtitle line, before the profile's Subtitle, in the subtitle's color; the subtitle line shows only when the tab bar is 28 points or taller (Advanced > Tabs \"Default tab bar height\")."

[[setting]]
key = "StretchTabsToFillBar"
tab = "Appearance"
section = "Tabs"
label = "Stretch tabs to fill bar"
type = "bool"
default = true
help = "Tabs widen to share the whole tab bar; off, they keep their preferred width."

[[setting]]
key = "HTMLTabTitles"
tab = "Appearance"
section = "Tabs"
label = "Support basic HTML tags in tab titles"
type = "bool"
default = false
help = "The following tags are recognized: <u>, <i>, and <b>. You can also use &lt; and &amp;."

[[setting]]
key = "ScrollableSideTabBar"
tab = "Appearance"
section = "Tabs"
label = "Tab bar scrolls when tabs don\u2019t fit"
type = "bool"
default = true
help = "When the tabs do not fit, the tab bar scrolls; off, the tabs that do not fit go in a menu at the bar's end."

[[setting]]
key = "LeftTabBarWidth"
tab = "Appearance"
section = "Tabs"
label = "Left (side) tab bar width"
type = "float"
default = 150.0
help = "Width in points of a tab bar on the left or right side of the window. Dragging the bar's inner edge records the width."

[[setting]]
key = "ShowFullScreenTabBar"
tab = "Appearance"
section = "Tabs"
label = "Show tab bar in fullscreen"
type = "bool"
default = true
help = "In full screen the tab bar shows as it does in a window; off, it hides (View > Show Tabs in Fullscreen)."

[[setting]]
key = "FlashTabBarInFullscreen"
tab = "Appearance"
section = "Tabs"
label = "Flash tab bar when switching tabs in fullscreen"
type = "bool"
default = false
help = "With the tab bar hidden in full screen, switching tabs shows it briefly over the top of the sessions. Hold Win to keep it up."

[[setting]]
key = "PreserveWindowSizeWhenTabBarVisibilityChanges"
tab = "Appearance"
section = "Tabs"
label = "Preserve window size when tab bar shows or hides"
type = "bool"
default = false
help = "When the tab bar appears or goes away the window keeps its size and the sessions give up or take the room; off, the window grows or shrinks by the bar."

[[setting]]
key = "PreserveWindowSizeToKeepOnScreenWhenTabBarVisibilityChanges"
tab = "Appearance"
section = "Tabs"
label = "\u2026but only if it would cause the window to go off-screen"
type = "bool"
default = false
help = "The window keeps its size only when growing for the tab bar would take it past the edge of the screen; it then also keeps its size when the bar goes away again."

[[setting]]
key = "PerPaneBackgroundImage"
tab = "Appearance"
section = "Panes"
label = "Separate background images per pane"
type = "bool"
default = true
help = "Each split pane shows its own profile's background image; off, the active pane's image spans the whole tab."

[[setting]]
key = "Print In Black And White"
tab = "General"
section = "Printing"
label = "Print in black and white"
type = "bool"
default = true
help = "Shell > Print leaves out text and background colors."

[[setting]]
key = "fileDropCoprocess"
tab = "Advanced"
section = "Terminal"
label = "When files are dropped into a terminal window, execute a silent coprocess."
type = "string"
default = ""
help = "When files are dropped into a terminal window, execute a silent coprocess.\nThis is an interpolated string. Use \\(filenames) to reference the shell-quoted, space-delimited full paths to the dropped files. If this preference is empty, the filenames get pasted instead."

[[setting]]
key = "AlwaysUseLineStyleMarks"
tab = "Advanced"
section = "Drawing"
label = "Always use line-style marks?"
type = "bool"
default = false
help = "Always use line-style marks?"

[[setting]]
key = "P3"
tab = "Advanced"
section = "Terminal"
label = "Use P3 as default color space? If No, sRGB will be used."
type = "bool"
default = true
help = "Use P3 as default color space? If No, sRGB will be used."

[[setting]]
key = "AllowHDR"
tab = "Advanced"
section = "Drawing"
label = "Allow HDR effects"
type = "bool"
default = false
help = "Allow HDR effects\nWhen enabled, Tandem may render some UI effects, such as the selected tab's outline, brighter than white on an HDR-capable display. Off by default because forcing the display into extended dynamic range can cause hangs on some systems."

[[setting]]
key = "disableTopRightIndicators"
tab = "Advanced"
section = "Drawing"
label = "Disable indicator icons that appear in the top right of a session?"
type = "bool"
default = false
help = "Disable indicator icons that appear in the top right of a session?\nThis includes the following indicators: maximized pane, broadcast input, coprocess running, alert on next mark, output suppression, zoom, copy mode, and debug logging."

[[setting]]
key = "showAutomaticProfileSwitchingBanner"
tab = "Advanced"
section = "Session"
label = "Show a \u201cSwitched to profile\u201d message when Automatic Profile Switching activates."
type = "bool"
default = true
help = "Show a \u201cSwitched to profile\u201d message when Automatic Profile Switching activates."

[[setting]]
key = "preserveFontSizeOnAutomaticProfileSwitch"
tab = "Advanced"
section = "Session"
label = "Preserve font zoom level when Automatic Profile Switching changes profiles."
type = "bool"
default = true
help = "Preserve font zoom level when Automatic Profile Switching changes profiles."

[[setting]]
key = "NoSyncEnableAutomaticProfileSwitchingLogging"
tab = "Stored"
section = "Script Console"
label = "Write Automatic Profile Switching debug logs"
type = "bool"
default = false
help = "Each Automatic Profile Switching decision goes to the Script Console's \"Automatic Profile Switching\" entry (Scripts > Manage > Console), as in iTerm2."

[[setting]]
key = "WindowNumber"
tab = "Appearance"
section = "Windows"
label = "Show window number"
type = "bool"
default = true
help = "A window with a title bar shows its number (1, 2, ...) as a label at the right of the title, with its switch shortcut. A window without a title bar, in full screen, or with Show window number in titlebar accessory? off, starts its title with \"N. \" instead."

[[setting]]
key = "openProfilesInNewWindow"
tab = "Advanced"
section = "Tabs"
label = "Choosing a profile from the \u201cProfiles\u201d menu opens a new window."
type = "bool"
default = false
help = "Choosing a profile from the \u201cProfiles\u201d menu opens a new window.\nWith Alt held, the profile opens in a new tab instead (the reverse of the usual). A change here takes effect at once."

[[setting]]
key = "WindowPlacement"
tab = "Appearance"
section = "Windows"
label = "New window placement"
type = "enum"
default = 3
choices = [ { value = 0, label = "Let Windows decide the position of new windows and use size from profile" }, { value = 1, label = "Smart Window Placement" }, { value = 2, label = "Remember the size and position of previously closed windows" }, { value = 3, label = "Remember the position of previously closed windows and use size from profile" } ]
help = "Where a new window opens. Smart Window Placement puts new windows where the most free space is available. Saved frames are kept per profile."

[[setting]]
key = "HideScrollbar"
tab = "Appearance"
section = "Windows"
label = "Hide scrollbars"
type = "bool"
default = false
help = "Hide scrollbars"

[[setting]]
key = "UseBorder"
tab = "Appearance"
section = "Windows"
label = "Heavy border around windows in light mode"
type = "bool"
default = false
help = "Draws a border around the window when the OS otherwise would not. This is effective in light mode or when the window contains a transparent pane. Windows 11 draws it; Windows 10 shows none."

[[setting]]
key = "DisableFullscreenTransparency"
tab = "Appearance"
section = "Windows"
label = "Disable transparency for non-native fullscreen windows by default"
type = "bool"
default = false
help = "Turns off window transparency automatically when a window enters full screen; leaving full screen turns it back on unless you toggled it meanwhile."

[[setting]]
key = "HideMenuBarInFullscreen"
tab = "Appearance"
section = "Windows"
label = "Auto-hide menu bar in non-native fullscreen"
type = "bool"
default = true
help = "A full screen window hides its menu bar, which comes back when the window leaves full screen. Turn this off to keep the menu bar visible; this is useful for multi-monitor systems."

[[setting]]
key = "EnableDivisionView"
tab = "Appearance"
section = "Windows"
label = "Show line under title bar when the tab bar is not visible"
type = "bool"
default = true
help = "A one-point line (2 pixels at 150% scale and above) separates the title bar from the terminal when no tab bar shows at the top of the window. It is not drawn in full screen, in windows without a title bar, or with the Minimal theme."

[[setting]]
key = "OnlyWhenMoreTabs"
tab = "General"
section = "Closing"
label = "Confirm closing multiple sessions"
type = "bool"
default = true
help = "Closing a tab or window with more than one running session asks first."

[[setting]]
key = "moveLeftAfterClosingTab"
tab = "Advanced"
section = "Tabs"
label = "Select the tab to the left when closing a tab?"
type = "bool"
default = false
help = "Select the tab to the left when closing a tab?\nIf disabled, the tab to the right of the closing tab will be selected."

[[setting]]
key = "PromptOnQuit"
tab = "General"
section = "Closing"
label = "Confirm \"Quit Tandem\""
type = "bool"
default = true
help = "Quitting asks first while a terminal window is open."

[[setting]]
key = "AdjustWindowForFontSizeChange"
tab = "General"
section = "Window"
label = "Adjust window when changing font size"
type = "bool"
default = true
help = "If enabled, changes to font size will try to preserve session dimensions."

[[setting]]
key = "MaxVertically"
tab = "General"
section = "Window"
label = "Zoom maximizes vertically only"
type = "bool"
default = false
help = "Window > Zoom stretches the window to the screen's height and keeps its width and position across."

[[setting]]
key = "SeparateWindowTitlePerTab"
tab = "General"
section = "Window"
label = "Each tab may have its own window title"
type = "bool"
default = true
help = "The OSC 0 and OSC 2 control sequences set the window title. This setting controls whether such a control sequence changes the window title associated with all sessions in the window, or only with the one in which it was received. The window title is derived from the window title associated with the currently active session in that window."

[[setting]]
key = "PromptOnQuitEvenIfThereAreNoWindows"
tab = "General"
section = "Closing"
label = "Even if there are no windows"
type = "bool"
default = false
help = "Quitting asks first even with no terminal window open (only with Confirm \"Quit Tandem\")."

[[setting]]
key = "QuitWhenAllWindowsClosed"
tab = "General"
section = "Closing"
label = "Quit when all windows are closed"
type = "bool"
default = false
help = "Tandem ends when its last window closes. On Windows a Tandem with no window cannot be reached, so Tandem also ends when this is off, until hotkey windows (milestone 7e) can bring one back."

[[setting]]
key = "NeverBlockSystemShutdown"
tab = "General"
section = "Closing"
label = "Disable all confirmations on system shutdown, restart, and log out"
type = "bool"
default = false
help = "Windows shutting down, restarting, or signing out never waits for Tandem's questions."

[[setting]]
key = "OpenBookmark"
tab = "General"
section = "Startup"
label = "Open profiles window"
type = "bool"
default = false
help = "The Profiles window also opens when Tandem starts."

[[setting]]
key = "OpenArrangementAtStartup"
tab = "General"
section = "Startup"
label = "Open default window arrangement"
type = "bool"
default = false
help = "Tandem starts with the default window arrangement (Window > Arrangements) instead of one window."

[[setting]]
key = "OpenNoWindowsAtStartup"
tab = "General"
section = "Startup"
label = "Only restore hotkey window"
type = "bool"
default = false
help = "Tandem starts with only its hotkey windows. With no hotkey window a window opens anyway, since Windows would show nothing."

[[setting]]
key = "RestoreWindowsToSameSpaces"
tab = "General"
section = "Startup"
label = "Restore windows to same desktops"
type = "bool"
default = false
help = "When windows are restored at launch, each goes back to the virtual desktop it was on, if that desktop still exists."

[[setting]]
key = "AlwaysOpenWindowAtStartup"
tab = "General"
section = "Startup"
label = "Always open at least one terminal window at startup"
type = "bool"
default = false
help = "The existence of hotkey windows disables opening a window at startup. This opens one anyway."

[[setting]]
key = "IRMemory"
tab = "General"
section = "Instant Replay"
label = "Memory usage per session (in MB)"
type = "int"
default = 4
min = 0
max = 1000
help = "Megabytes of memory each session keeps for Instant Replay. A change applies to sessions started after it."

[[setting]]
key = "EnableAPIServer"
tab = "General"
section = "Python API"
label = "Enable Python API"
type = "bool"
default = false
help = "Runs the Python API server on 127.0.0.1 and [::1] port 1912 so scripts can control Tandem. Turning it off disconnects every script."

[[setting]]
key = "API Authentication Method"
tab = "General"
section = "Python API"
label = "Authentication method for Python API"
type = "enum"
choices = [{ value = 0, label = "Require a cookie" }, { value = 1, label = "Allow all apps to connect" }]
default = 0
help = "Whether scripts need a cookie (scripts started in a Tandem session with setCookie on have one), or any program running as you may connect. The choice is stored as a file that the iterm2 Python package also reads."

[[setting]]
key = "UseCustomScriptsFolder"
tab = "General"
section = "Python API"
label = "Custom Python API Scripts Folder"
type = "bool"
default = false
help = "Tandem looks for Python API scripts in this folder instead of %APPDATA%\\Tandem\\Scripts. It must exist and have no spaces in its path. Network paths are not supported."

[[setting]]
key = "CustomScriptsFolder"
tab = "General"
section = "Python API"
label = "Custom folder for Python API scripts"
type = "string"
default = ""
help = "Tandem looks for Python API scripts in this folder instead of %APPDATA%\\Tandem\\Scripts. It must exist and have no spaces in its path. Network paths are not supported."

[[setting]]
key = "openNewWindowAtStartup"
tab = "Advanced"
section = "General"
label = "Open a window at startup?"
type = "bool"
default = true
help = "Open a window at startup?\nThis is useful if you wish to use the system window restoration settings but not create a new window if none would be restored."

[[setting]]
key = "runJobsInServers"
tab = "Advanced"
section = "Session"
label = "Enable session restoration."
type = "bool"
default = true
help = "Enable session restoration.\nSession restoration runs jobs in a separate process (tandem-host). They will survive crashes, force quits, and upgrades.\nYou must restart Tandem for this change to take effect."

[[setting]]
key = "killJobsInServersOnQuit"
tab = "Advanced"
section = "Session"
label = "User-initiated Quit (Win+Q) of Tandem will kill all running jobs."
type = "bool"
default = true
help = "User-initiated Quit (Win+Q) of Tandem will kill all running jobs.\nApplies only when session restoration is on."

[[setting]]
key = "showSessionRestoredBanner"
tab = "Advanced"
section = "Session"
label = "When restoring a session without restoring a running job, draw a banner saying \u201cSession Contents Restored\u201d below the restored contents."
type = "bool"
default = true
help = "When restoring a session without restoring a running job, draw a banner saying \u201cSession Contents Restored\u201d below the restored contents."

[[setting]]
key = "composerClearSequence"
tab = "Advanced"
section = "Session"
label = "Hex codes to send to clear the command line when entering the composer."
type = "string"
default = "0x15 0x0b"
help = "Hex codes to send to clear the command line when entering the composer.\n0x15 is ^U, 0x0b is ^K."

[[setting]]
key = "alwaysUseStatusBarComposer"
tab = "Advanced"
section = "Session"
label = "Temporarily add a composer to the status bar instead of opening the large composer view when a status bar is present."
type = "bool"
default = false
help = "Temporarily add a composer to the status bar instead of opening the large composer view when a status bar is present."

[[setting]]
key = "timeoutForDaemonAttachment"
tab = "Advanced"
section = "Session"
label = "How long to wait when trying to attach to the session host at startup when restoring windows (in seconds)?"
type = "float"
default = 10.0
help = "How long to wait when trying to attach to the session host at startup when restoring windows (in seconds)?"

[[setting]]
key = "translateScreenToXterm"
tab = "Advanced"
section = "Terminal"
label = "Support TERM=screen"
type = "bool"
default = true
help = "Support TERM=screen\nMost notably, this fixes italics replacing inverse text."

[[setting]]
key = "convertItalicsToReverseVideoForTmux"
tab = "Advanced"
section = "Terminal"
label = "Convert italics to reverse video in tmux integration?"
type = "bool"
default = true
help = "Convert italics to reverse video in tmux integration?\nThis is effective when the default TERM reported by tmux matches *screen*."

[[setting]]
key = "convertItalicsToReverseVideoForTmuxBugwardsCompatible"
tab = "Advanced"
section = "Terminal"
label = "Convert italics to reverse video in tmux integration, even when TERM matches *tmux*?"
type = "bool"
default = false
help = "Convert italics to reverse video in tmux integration, even when TERM matches *tmux*?\nThis was the default behavior for a long time, but it was incorrect. The conversion should only be done when TERM matches *screen*."

[[setting]]
key = "echoProbeDuration"
tab = "Advanced"
section = "Terminal"
label = "Amount of time to wait while testing if echo is on (seconds)."
type = "float"
default = 0.5
help = "Amount of time to wait while testing if echo is on (seconds).\nThis is used by the password manager to ensure you're at a password prompt. Set to 0 to disable echo probe."

[[setting]]
key = "disablePasswordManagerAnimations"
tab = "Advanced"
section = "Terminal"
label = "Disable animations for showing/hiding password manager."
type = "bool"
default = false
help = "Disable animations for showing/hiding password manager."

[[setting]]
key = "detectPasswordInput"
tab = "Advanced"
section = "Terminal"
label = "Show key at cursor at password prompt?"
type = "bool"
default = true
help = "Show key at cursor at password prompt?"

[[setting]]
key = "detectPasswordInputDebounce"
tab = "Advanced"
section = "Terminal"
label = "How long (seconds) terminal echo must remain disabled before Tandem treats it as a password prompt."
type = "float"
default = 0.2
help = "How long (seconds) terminal echo must remain disabled before Tandem treats it as a password prompt.\nThis prevents shell scripts that briefly turn off echo (e.g. while reading the response to an OSC report request) from triggering the password manager. Set to 0 to disable debouncing."

[[setting]]
key = "RequireAuthenticationToOpenPasswordManager"
tab = "Stored"
section = "Password Manager"
label = "Require authentication to open the password manager"
type = "bool"
default = true
help = "Asks for Windows Hello (or your Windows password) before the password manager opens. The same setting is in the password manager's gear menu; it is here too so a failed prompt can never lock you out."

[[setting]]
key = "RequireAuthenticationAfterScreenLocks"
tab = "Stored"
section = "Password Manager"
label = "Require authentication after the screen locks"
type = "bool"
default = false
help = "Locking the screen ends the password manager's authentication, and closes any open password manager while authentication is required."

[[setting]]
key = "RequireAuthenticationOnEveryPasswordManagerOpen"
tab = "Stored"
section = "Password Manager"
label = "Require authentication on every open"
type = "bool"
default = false
help = "Asks again each time the password manager opens, instead of once until Tandem quits or the screen locks."

[[setting]]
key = "restoreWindowContents"
tab = "Advanced"
section = "Terminal"
label = "Restore window contents at startup."
type = "bool"
default = true
help = "Restore window contents at startup."

[[setting]]
key = "maxHistoryLinesToRestore"
tab = "Advanced"
section = "Terminal"
label = "Maximum number of lines of history to restore."
type = "int"
default = 20000
help = "Maximum number of lines of history to restore.\nWhen the app is relaunched, only the last N lines of history are restored to avoid making launch too slow. If you reduce this number, existing sessions won't be affected until their history is cleared."

[[setting]]
key = "DisableWindowSizeSnap"
tab = "Advanced"
section = "Windows"
label = "Terminal windows resize smoothly."
type = "bool"
default = false
help = "Terminal windows resize smoothly.\nDisables snapping to character grid. Holding Control will temporarily disable snap-to-grid."

[[setting]]
key = "restoreWindowsWithinScreens"
tab = "Advanced"
section = "Windows"
label = "When restoring a window arrangement, ensure windows are entirely within the bounds of the current displays."
type = "bool"
default = true
help = "When restoring a window arrangement, ensure windows are entirely within the bounds of the current displays."

[[setting]]
key = "ShowWindowTitleWhenTabBarInvisible"
tab = "Advanced"
section = "Windows"
label = "Show window title when the tab bar is not visible?"
type = "bool"
default = true
help = "Show window title when the tab bar is not visible?\nWhen disabled, the tab's title will be shown where the window title would normally go."

[[setting]]
key = "SquareWindowCorners"
tab = "Advanced"
section = "Windows"
label = "Windows have square corners."
type = "bool"
default = false
help = "Windows have square corners.\nWindows 11 rounds window corners; this turns the rounding off. You must restart Tandem after changing this setting for it to take effect."

[[setting]]
key = "WindowBorderColor"
tab = "Advanced"
section = "Windows"
label = "Border color for focused windows."
type = "string"
default = ""
help = "Border color for focused windows.\nShould be a web-style color, #rrggbb, or #rrggbbaa to also set opacity. You can also use p3#rrggbb or p3#rrggbbaa for p3 color space. Without an alpha component the border is drawn at 75% opacity. Requires \u201cHeavy border around windows in light mode\u201d. Leave empty for the default color. Windows draws the border opaque, so the opacity is not used."

[[setting]]
key = "WindowBorderColorUnfocused"
tab = "Advanced"
section = "Windows"
label = "Border color for unfocused windows."
type = "string"
default = ""
help = "Border color for unfocused windows.\nShould be a web-style color, #rrggbb, or #rrggbbaa to also set opacity. You can also use p3#rrggbb or p3#rrggbbaa for p3 color space. Without an alpha component the border is drawn at 75% opacity. Leave empty to match the focused color. Windows draws the border opaque, so the opacity is not used."

[[setting]]
key = "UseShortcutAccessoryViewController"
tab = "Advanced"
section = "Windows"
label = "Show window number in titlebar accessory?"
type = "bool"
default = true
help = "Show window number in titlebar accessory?"

[[setting]]
key = "IncludeShortcutInWindowsMenu"
tab = "Advanced"
section = "Windows"
label = "Include keyboard shortcut for windows in Window menu?"
type = "bool"
default = true
help = "Include keyboard shortcut for windows in Window menu?"

[[setting]]
key = "BordersOnlyInLightMode"
tab = "Advanced"
section = "Windows"
label = "Opaque windows have a border only in light mode."
type = "bool"
default = true
help = "Opaque windows have a border only in light mode.\nThis setting modifies \u201cHeavy border around windows in light mode\u201d. Borders in opaque windows in dark mode are ugly and the OS draws one that is pretty serviceable. Enable this if you have trouble seeing them."

[[setting]]
key = "AllowLiveResize"
tab = "Advanced"
section = "Windows"
label = "Allow window resizing by dragging edges and corners?"
type = "bool"
default = true
help = "Allow window resizing by dragging edges and corners?"

[[setting]]
key = "Hotkey"
tab = "Keys"
section = "Hotkey"
label = "Show/hide all windows with a system-wide hotkey"
type = "bool"
default = false
help = "A system-wide hotkey shows and hides all of Tandem's windows."

[[setting]]
key = "HotkeyCode"
tab = "Keys"
section = "Hotkey"
label = "App hotkey key code"
type = "int"
default = 0
help = "The app hotkey's key (macOS key code, as iTerm2 stores it)."

[[setting]]
key = "HotkeyChar"
tab = "Keys"
section = "Hotkey"
label = "App hotkey character"
type = "int"
default = 0
help = "The app hotkey's character."

[[setting]]
key = "HotkeyModifiers"
tab = "Keys"
section = "Hotkey"
label = "App hotkey modifiers"
type = "int"
default = 0
help = "The app hotkey's modifiers (iTerm2's flags; Command is Win, Option is Alt)."

[[setting]]
key = "hotkeyTermAnimationDuration"
tab = "Advanced"
section = "Hotkey"
label = "Duration in seconds of the hotkey window animation."
type = "float"
default = 0.25
help = "Duration in seconds of the hotkey window animation.\nWarning: reducing this value may cause problems if you have multiple displays."

[[setting]]
key = "OpenQuicklyHotkeyCode"
tab = "Keys"
section = "Hotkey"
label = "Open Quickly hotkey key code"
type = "int"
default = 0
help = "The Open Quickly hotkey's key (macOS key code, as iTerm2 stores it); 0 with no character is unbound."

[[setting]]
key = "OpenQuicklyHotkeyChar"
tab = "Keys"
section = "Hotkey"
label = "Open Quickly hotkey character"
type = "int"
default = 0
help = "The Open Quickly hotkey's character."

[[setting]]
key = "OpenQuicklyHotkeyModifiers"
tab = "Keys"
section = "Hotkey"
label = "Open Quickly hotkey modifiers"
type = "int"
default = 0
help = "The Open Quickly hotkey's modifiers (iTerm2's flags; Command is Win, Option is Alt)."

[[setting]]
key = "openQuicklyAnimationDuration"
tab = "Advanced"
section = "Hotkey"
label = "Duration in seconds of the Open Quickly window height animation."
type = "float"
default = 0.12
help = "Duration in seconds of the Open Quickly window height animation.\nSet to 0 to disable the animation."

[[setting]]
key = "hotKeyDoubleTapMaxDelay"
tab = "Advanced"
section = "Hotkey"
label = "The maximum amount of time allowed between presses of a modifier key when performing a modifier double-tap."
type = "float"
default = 0.3
help = "The maximum amount of time allowed between presses of a modifier key when performing a modifier double-tap."

[[setting]]
key = "hotKeyDoubleTapMinDelay"
tab = "Advanced"
section = "Hotkey"
label = "The minimum amount of time required between presses of a modifier key when performing a modifier double-tap."
type = "float"
default = 0.01
help = "The minimum amount of time required between presses of a modifier key when performing a modifier double-tap."

[[setting]]
key = "QuickPasteBytesPerCall"
tab = "Advanced"
section = "Pasteboard"
label = "Number of bytes to paste in each chunk when pasting normally."
type = "int"
default = 768
help = "Number of bytes to paste in each chunk when pasting normally."

[[setting]]
key = "QuickPasteDelayBetweenCalls"
tab = "Advanced"
section = "Pasteboard"
label = "Delay in seconds between chunks when pasting normally."
type = "float"
default = 0.01
help = "Delay in seconds between chunks when pasting normally."

[[setting]]
key = "SlowPasteBytesPerCall"
tab = "Advanced"
section = "Pasteboard"
label = "Number of bytes to paste in each chunk when pasting slowly."
type = "int"
default = 16
help = "Number of bytes to paste in each chunk when pasting slowly."

[[setting]]
key = "SlowPasteDelayBetweenCalls"
tab = "Advanced"
section = "Pasteboard"
label = "Delay in seconds between chunks when pasting slowly"
type = "float"
default = 0.125
help = "Delay in seconds between chunks when pasting slowly"

[[setting]]
key = "PastingClearsSelection"
tab = "Advanced"
section = "Pasteboard"
label = "Pasting text will remove the selection."
type = "bool"
default = true
help = "Pasting text will remove the selection."

[[setting]]
key = "PromptForPasteWhenNotAtPrompt"
tab = "Advanced"
section = "Pasteboard"
label = "Warn before pasting when not at shell prompt?"
type = "bool"
default = false
help = "Warn before pasting when not at shell prompt?"

[[setting]]
key = "AlwaysWarnBeforePastingOverSize"
tab = "Advanced"
section = "Pasteboard"
label = "When pasting more than this many characters, require confirmation."
type = "int"
default = -1
help = "When pasting more than this many characters, require confirmation.\nSet to -1 to disable warning.\nCharacters are counted in UTF-16."

[[setting]]
key = "FontsForGenerousRounding"
tab = "Advanced"
section = "Experimental Features"
label = "List of fonts to use alternate rounding algorithm for line height calculation."
type = "string"
default = "consolas"
help = "List of fonts to use alternate rounding algorithm for line height calculation.\nThis fixes consolas and emulates Terminal.app\u2019s behavior on macOS 10.15. This is a comma-delimited list of font family substrings."

[[setting]]
key = "MinimumWeightDifferenceForBoldFont"
tab = "Advanced"
section = "Drawing"
label = "Minimum weight difference between regular and bold font."
type = "int"
default = 4
help = "Minimum weight difference between regular and bold font.\nThis affects selection of the bold version of a font. Font weights go from 0 to 9. If no font can be found that has a high enough weight then the regular font will be double-struck with a small offset."

[[setting]]
key = "PreferSpeedToFullLigatureSupport"
tab = "Advanced"
section = "Drawing"
label = "Improves drawing performance at the expense of disallowing alphanumeric characters to belong to ligatures."
type = "bool"
default = true
help = "Improves drawing performance at the expense of disallowing alphanumeric characters to belong to ligatures."

[[setting]]
key = "EnableContextualAlternates"
tab = "Advanced"
section = "Drawing"
label = "Enable contextual alternates (calt) for ligature-capable fonts."
type = "bool"
default = true
help = "Enable contextual alternates (calt) for ligature-capable fonts.\nWhen enabled, uses ligature level 2 which activates calt in addition to standard ligatures. Many coding fonts such as Monaspace, Iosevka, and Cascadia Code require this for their ligatures to work."

[[setting]]
key = "ForceAntialiasingOnRetina"
tab = "Advanced"
section = "Drawing"
label = "Force text to be anti-aliased on Retina displays."
type = "bool"
default = false
help = "Force text to be anti-aliased on Retina displays.\nEnable this to use non-AA text on non-retina displays, which sometimes looks better."

[[setting]]
key = "DisableCustomBoxDrawing"
tab = "Advanced"
section = "Drawing"
label = "Use your typeface\u2019s box-drawing characters instead of Tandem\u2019s custom drawing code."
type = "bool"
default = false
help = "Use your typeface\u2019s box-drawing characters instead of Tandem\u2019s custom drawing code.\nYou must restart Tandem after changing this setting."

[[setting]]
key = "MakeSomePowerlineSymbolsWide"
tab = "Advanced"
section = "Drawing"
label = "Draw certain Powerline symbols double-width?"
type = "bool"
default = true
help = "Draw certain Powerline symbols double-width?\nThis matches how most \u201cnerd\u201d fonts render them, but your favorite one might not do this. An example code point that is affected is U+E0B8."

[[setting]]
key = "SupportPowerlineExtendedSymbols"
tab = "Advanced"
section = "Drawing"
label = "Include extended symbols when drawing Powerline natively."
type = "bool"
default = true
help = "Include extended symbols when drawing Powerline natively."

[[setting]]
key = "DetectParagraphDirection"
tab = "Advanced"
section = "Experimental Features"
label = "Auto-detect paragraph writing direction based on the first strong directional character?"
type = "bool"
default = false
help = "Auto-detect paragraph writing direction based on the first strong directional character?\nRequires right-to-left text support to be enabled."

[[setting]]
key = "RightJustifyRTLLines"
tab = "Advanced"
section = "Experimental Features"
label = "Right-justify lines in paragraphs with base writing direction of right-to-left?"
type = "bool"
default = true
help = "Right-justify lines in paragraphs with base writing direction of right-to-left?\nRequires BOTH \u201cright-to-left text support\u201d and \u201cauto-detect paragraph writing detection\u201d to be enabled."

[[setting]]
key = "ShowLocationsInScrollbar"
tab = "Advanced"
section = "Experimental Features"
label = "Show search result and prompt locations in scroll bar."
type = "bool"
default = true
help = "Show search result and prompt locations in scroll bar.\nChanging this setting will not affect existing sessions until you restart."

[[setting]]
key = "ShowMarksInScrollbar"
tab = "Advanced"
section = "Experimental Features"
label = "Show prompt locations in scroll bar?"
type = "bool"
default = true
help = "Show prompt locations in scroll bar?\nChanging this setting will not affect existing sessions until you restart. You must also enable \u201cShow search result and prompt locations in scroll bar\u201d for this to take effect."

[[setting]]
key = "DisableBidiInAlternateScreen"
tab = "Advanced"
section = "Experimental Features"
label = "Do not reorder right-to-left text in the alternate screen?"
type = "bool"
default = false
help = "Do not reorder right-to-left text in the alternate screen?\nFull-screen apps (editors and some CLIs) position their own text and may already order it for display, so reordering it again fights their layout. Turn this on to leave alternate-screen text unreordered. Requires right-to-left text support."

[[setting]]
key = "EscapeWithQuotes"
tab = "Advanced"
section = "Experimental Features"
label = "Escape file names with single quotes instead of backslashes."
type = "bool"
default = false
help = "Escape file names with single quotes instead of backslashes.\nThis is intended for users of xonsh, which does not accept backslash escaping."

[[setting]]
key = "StripZeroWidthFormatCharactersOnPaste"
tab = "Advanced"
section = "Terminal"
label = "Strip zero-width bidi/format characters when pasting?"
type = "bool"
default = false
help = "Strip zero-width bidi/format characters when pasting?\nCharacters like the Zero-Width Non-Joiner (U+200C, the Persian half-space), ZWJ, LRM, and RLM are invisible but line editors like zsh render them as a visible <200c> at the prompt. Turn this on to remove them from pasted text so the command line stays clean. Off by default because these characters are meaningful; enabling this changes the pasted text."

[[setting]]
key = "PasteTabToStringTabStopSize"
tab = "Stored"
section = "Paste"
label = "The number of spaces for each tab when a paste converts tabs to spaces."
type = "int"
default = 4
help = "The number of spaces for each tab when a paste converts tabs to spaces."

[[setting]]
key = "SuppressMultilinePasteWarningWhenPastingOneLineWithTerminalNewline"
tab = "Advanced"
section = "Warnings"
label = "Suppress warning about multi-line paste when pasting a single line ending with a newline."
type = "bool"
default = false
help = "Suppress warning about multi-line paste when pasting a single line ending with a newline.\nThis suppresses all multi-line paste warnings when a single line is being pasted."

[[setting]]
key = "SuppressMultilinePasteWarningWhenNotAtShellPrompt"
tab = "Advanced"
section = "Warnings"
label = "Suppress warning about multi-line paste when not at prompt."
type = "bool"
default = false
