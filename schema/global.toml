key = "aiChatRawWireLogging"
tab = "Advanced"
section = "Debugging"
label = "Log raw AI API requests and responses to disk."
type = "bool"
default = false
help = "Log raw AI API requests and responses to disk.\nWrites every byte sent to and received from the AI vendor (request headers, body, streaming chunks, final response, errors, and timing) to %APPDATA%\\Tandem\\AIChatWire\\. One log file per app launch; rotate or delete it yourself when done. Every header value except known non-secret ones (such as Content-Type, Accept, User-Agent and anthropic-version), and keys that appear in URLs or bodies, are replaced by fingerprints (the first 8 and last 4 characters); prompt and response content is logged verbatim. Off by default; turn on only while reproducing an issue and delete the files when finished."

[[setting]]
key = "unameCommand"
tab = "Advanced"
section = "SSH Integration"
label = "Command used to set the `uname` variable."
type = "string"
default = "uname -s"
help = "Command used to set the `uname` variable.\nThe main use of this is to use in the AI prompt so the language model knows the operating system."

[[setting]]
key = "aiModernModelPrefixes"
tab = "Advanced"
section = "Experimental Features"
label = "AI model name substrings that use the modern 'completions' API."
type = "string"
default = "gpt-"
help = "AI model name substrings that use the modern 'completions' API.\nSubstrings should be space-delimited. This handles OpenRouter-style names like 'openai/gpt-4o'. Note that o1 models use a different API and have hard-coded behavior."

[[setting]]
key = "aiProxy"
tab = "Advanced"
section = "Experimental Features"
label = "Host and port for proxy for AI requests."
type = "string"
default = ""
help = "Host and port for proxy for AI requests.\ni.e., example.com:8080"

[[setting]]
key = "ollamaNumCtx"
tab = "Advanced"
section = "Experimental Features"
label = "Ollama context window size (num_ctx) for native /api/chat requests."
type = "int"
default = 0
help = "Ollama context window size (num_ctx) for native /api/chat requests.\nOllama defaults num_ctx to a small value (around 4096) regardless of the model, silently truncating long prompts. 0 means size it automatically per request, capped at the model\u2019s context window. A positive value overrides that and is sent verbatim (larger values use more memory)."

[[setting]]
key = "ollamaKeepAlive"
tab = "Advanced"
section = "Experimental Features"
label = "Ollama keep_alive for native /api/chat requests."
type = "string"
default = "30m"
help = "Ollama keep_alive for native /api/chat requests.\nHow long Ollama keeps the model resident after a request, e.g. 30m, 1h, or 0 to unload immediately. Empty means omit the field and use Ollama\u2019s own default."
[[setting]]
key = "noSyncDontWarnAboutTmuxPause"
