help = "URL to check for new versions of the Python scripting runtime."

[[setting]]
key = "uvManifestDownloadURL"
tab = "Advanced"
section = "Scripting"
label = "URL of the uv download manifest (used when the Python runtime is provisioned with uv)."
type = "string"
default = "https://iterm2.com/downloads/uv/manifest.json"
help = "URL of the uv download manifest (used when the Python runtime is provisioned with uv)."

[[setting]]
