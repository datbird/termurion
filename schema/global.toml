section = "Scripting"
label = "Use uv to provision the Python runtime for API scripts?"
type = "bool"
default = true
help = "Use uv to provision the Python runtime for API scripts?\nWhen enabled, Tandem uses uv to download Python and build per-script environments instead of the bundled Python runtime. Scripts already provisioned continue to run regardless of this setting; it only affects creating, importing, and migrating scripts."

[[setting]]
key = "setIT2AppPath"
tab = "Advanced"
section = "Scripting"
label = "Set IT2_APP_PATH environment variable on new sessions, pointing at this Tandem build\u2019s app bundle?"
type = "bool"
default = false
help = "Set IT2_APP_PATH environment variable on new sessions, pointing at this Tandem build\u2019s app bundle?\nThis disambiguates the AppleScript target when multiple Tandem builds with the same bundle identifier are running, so that the \u201cit2\u201d CLI requests its cookie from this Tandem instance. Intended for Tandem developers. Only affects sessions created after changing this setting."
