type = "string"
default = ""
help = "Folder for config files. There must not be a space in the path.\nIf empty, then %APPDATA%\\Tandem will be the default location."

[[setting]]
key = "NoSyncHideDefaultValuedSettings"
tab = "Stored"
section = "Settings"
label = "Show indicators for non-default values"
type = "bool"
default = false
help = "Settings marks each control whose value is not the default with a bar at its left."

[[setting]]
key = "NoSyncNeverRemindPrefsChangesLostForFile_selection"
tab = "Stored"
section = "Settings"
label = "Save changes to the custom folder"
type = "int"
default = 0
help = "The Save changes popup's choice (0 When Quitting, 1 Manually, 2 Automatically), and the answer to the silenced quit question."

[[setting]]
key = "NoSyncPromptBeforeLoadingPrefsFromURL"
tab = "Stored"
section = "Settings"
label = "Ask before loading settings from this URL"
type = "string"
default = ""
help = "Remembered at quit when local changes would be lost to the settings URL; the next load from it asks first."

[[setting]]
key = "NoSyncNeverRemindPrefsChangesLostForFile"
tab = "Advanced"
section = "Warnings"
label = "Suppress changed-setting warning when settings are loaded from a custom folder."
type = "bool"
default = false
