[[setting]]
key = "NoSyncNeverRemindPrefsChangesLostForUrl"
tab = "Advanced"
section = "Warnings"
label = "Suppress changed-setting warning when settings are loaded from a URL."
type = "bool"
default = false
help = "Suppress changed-setting warning when settings are loaded from a URL."

[[setting]]
key = "NoSyncDownloadPrefsTimeout"
tab = "Advanced"
section = "General"
