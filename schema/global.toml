section = "General"
label = "Buttons in modal alerts indicate keyboard shortcuts."
type = "bool"
default = false
help = "Buttons in modal alerts indicate keyboard shortcuts.\nDo you miss Windows 95? I do."

[[setting]]
key = "NoSyncSuppressedAlertsCatalog"
tab = "Stored"
